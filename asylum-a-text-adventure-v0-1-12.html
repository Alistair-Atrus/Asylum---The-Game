---

<!doctype html>
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asylum: A Text Adventure</title>
<style>
  :root {
    --bg: #0d0e12;
    --panel: #16181f;
    --panel2: #1c1f28;
    --ink: #d8d3c4;
    --dim: #8b8778;
    --accent: #c9a86a;
    --accent2: #7fa8c9;
    --line: #2a2e3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 17px;
    line-height: 1.55;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 860px;
    margin: 0 auto;
    padding: 12px;
    gap: 10px;
  }

  header {
    text-align: center;
    border-bottom: 1px solid var(--line);
    padding: 4px 0 10px;
  }
  header #location {
    font-size: 0.85rem;
    color: var(--dim);
    letter-spacing: 0.08em;
    margin-top: 4px;
  }

  /* ---- main text scroll area ---- */
  #story {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    scroll-behavior: smooth;
  }
  #story p { margin: 0 0 0.9em; }
  .room-title { color: var(--accent); font-style: italic; }
  .narration { color: var(--ink); }
  .system { color: var(--dim); font-style: italic; }
  .speech { color: var(--accent2); font-style: italic; }
  .choice-picked { color: var(--accent); }
  .old { opacity: 0.55; }

  /* ---- choice buttons (dialogue) ---- */
  #choices {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  #choices button {
    font-family: inherit;
    font-size: 0.95rem;
    background: var(--panel2);
    color: var(--ink);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    text-align: left;
  }
  #choices button:hover { background: var(--accent); color: #14130d; }

  /* ---- command line ---- */
  #inputrow { display: flex; gap: 8px; }
  #cmd {
    flex: 1;
    font-family: inherit;
    font-size: 1rem;
    background: var(--panel2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    outline: none;
  }
  #cmd:focus { border-color: var(--accent); }
  #go { font-family: inherit; }

  /* ---- compass + controls ---- */
  #controls {
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    padding: 4px 0;
  }
  #compass {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 44px);
    gap: 4px;
  }
  .dir {
    font-family: inherit;
    font-size: 0.9rem;
    background: var(--panel2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  .dir.active { border-color: var(--accent); color: var(--accent); }
  .dir:disabled { opacity: 0.25; cursor: default; }
  .dir:not(:disabled):hover { background: var(--accent); color: #14130d; }

  #sidebtns {
    display: grid;
    grid-template-columns: repeat(2, auto);
    gap: 6px;
  }

  .wide {
    font-family: inherit;
    font-size: 0.9rem;
    background: var(--panel2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    min-width: 110px;
  }
  .wide:hover { border-color: var(--accent); }
  .wide:disabled { opacity: 0.35; cursor: default; }
  .wide:disabled:hover { border-color: var(--line); }

  /* small save/load buttons, bottom right of the button zone */
  #savebar {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    padding: 0 2px 2px;
  }
  .mini {
    font-family: inherit;
    font-size: 0.72rem;
    background: var(--panel2);
    color: var(--dim);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 3px 9px;
    cursor: pointer;
  }
  .mini:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- inventory + grimoire windows ---- */
  #invwin, #grimwin {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #invwin[hidden], #grimwin[hidden] { display: none; }
  #invbox, #grimbox {
    width: min(90vw, 480px);
    height: min(80vh, 520px);
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  #invhead, #grimhead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 0.85rem;
  }
  #invclose, #grimclose {
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    border-radius: 6px;
    cursor: pointer;
    padding: 2px 8px;
    font-family: inherit;
  }
  #invclose:hover, #grimclose:hover { border-color: var(--accent); color: var(--accent); }

  #invtabs, #grimtabs {
    display: flex;
    gap: 4px;
    padding: 8px 10px 0;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .tabbtn {
    font-family: inherit;
    font-size: 0.8rem;
    background: none;
    color: var(--dim);
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    padding: 6px 10px;
    cursor: pointer;
    letter-spacing: 0.06em;
  }
  .tabbtn.active {
    color: var(--accent);
    border-color: var(--line);
    background: var(--panel2);
  }
  .tablist {
    flex: 1;
    overflow-y: auto;
    margin: 0; padding: 10px 14px 14px 26px;
    color: var(--dim);
    font-size: 0.9rem;
  }
  .tablist li { cursor: pointer; padding: 2px 0; }
  .tablist li:hover { color: var(--accent); }

  @media (max-width: 600px) {
    #invbox, #grimbox {
      width: 94vw;
      height: 85vh;
    }
    .tabbtn { padding: 6px 8px; }
  }

  .glyphrow {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* hand picker */
  #handwin {
    position: fixed; inset: 0; z-index: 15;
    background: rgba(0, 0, 0, 0.5);
    display: flex; align-items: center; justify-content: center;
  }
  #handwin[hidden] { display: none; }
  #handbox {
    width: min(86vw, 340px);
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 14px 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    text-align: center;
  }
  #handtitle {
    color: var(--accent); letter-spacing: 0.1em;
    text-transform: uppercase; font-size: 0.85rem; margin-bottom: 8px;
  }
  #handbody { color: var(--ink); font-size: 0.9rem; line-height: 1.4; margin-bottom: 12px; }
  #handbtns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #handbtns .wide { min-width: 120px; }

  /* glyph tooltip: 1s hover on desktop, 1s long-press on mobile */
  #glyphtip {
    position: fixed;
    display: none;
    max-width: 300px;
    padding: 8px 12px;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--dim);
    font-size: 0.85rem;
    line-height: 1.4;
    z-index: 20;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }

  /* ---- journal window ---- */
  #journal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #journal[hidden] { display: none; }
  #journalbox {
    width: min(90vw, 600px);
    height: min(80vh, 520px);
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  #journalhead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 0.85rem;
  }
  #journalclose {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
    padding: 2px 8px;
  }
  #journalclose:hover { border-color: var(--accent); }
  #journaltext {
    flex: 1;
    margin: 12px;
    padding: 12px;
    background: var(--panel2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.5;
    resize: none;
    outline: none;
  }
  #journaltext:focus { border-color: var(--accent); }
  #journalfoot {
    text-align: center;
    color: var(--dim);
    font-size: 0.75rem;
    padding: 0 0 10px;
    font-style: italic;
  }

  /* ---- OpenDyslexic (dyslexic mode) ---- */
  /* Four OpenType files ship in the fonts/ folder; bold and italic
     are real font files, not synthesized by the browser */
  @font-face {
    font-family: "OpenDyslexic";
    src: url("fonts/OpenDyslexic-Regular.otf") format("opentype");
    font-weight: normal; font-style: normal;
  }
  @font-face {
    font-family: "OpenDyslexic";
    src: url("fonts/OpenDyslexic-Bold.otf") format("opentype");
    font-weight: bold; font-style: normal;
  }
  @font-face {
    font-family: "OpenDyslexic";
    src: url("fonts/OpenDyslexic-Italic.otf") format("opentype");
    font-weight: normal; font-style: italic;
  }
  @font-face {
    font-family: "OpenDyslexic";
    src: url("fonts/OpenDyslexic-BoldItalic.otf") format("opentype");
    font-weight: bold; font-style: italic;
  }
  body.dys { font-family: "OpenDyslexic", Georgia, 'Times New Roman', serif; }
  /* bold in OpenDyslexic is subtle — lift those words a shade
     lighter so interactables still stand out */
  body.dys b { color: #f4eddb; }

  /* ---- title screen ---- */
  #titlescreen {
    position: fixed; inset: 0; z-index: 20;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; cursor: pointer; padding: 20px;
  }
  #titlescreen[hidden] { display: none; }
  #titleword {
    color: var(--accent);
    font-size: clamp(2rem, 8vw, 4rem);
    letter-spacing: 0.3em;
    margin: 0 0 0 0.3em; /* balance the tracking */
    font-weight: normal;
  }
  #titlesub {
    color: var(--ink); letter-spacing: 0.22em;
    text-transform: uppercase; font-size: 0.9rem;
  }
  #titleprompt {
    color: var(--dim); font-size: 0.8rem;
    animation: titleblink 1.8s infinite;
  }
  @keyframes titleblink { 50% { opacity: 0.25; } }
  #dysbtn {
    margin-top: 34px;
    background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 18px; font-size: 0.8rem;
    letter-spacing: 0.08em; cursor: pointer;
  }
  #dysbtn:hover { color: var(--accent); border-color: var(--accent); }

  /* ---- stat HUD: coherence & alignment, always visible ---- */
  #hud {
    position: static; margin: 6px auto 0; width: fit-content;
    background: rgba(13, 14, 18, 0.88);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; font-size: 0.78rem;
    color: var(--dim); letter-spacing: 0.06em;
  }
  #hud b { color: var(--accent); font-weight: normal; }
  #hud.low b { color: #d98a8a; }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    #compass { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 40px); }
    .wide { min-width: 90px; }
    /* HUD flows under the room name instead of overlapping it */
    #hud { padding: 4px 9px; font-size: 0.72rem; }
  }
</style>
</head>
<body>

<!-- title screen -->
<div id="titlescreen">
  <div id="titleword">ASYLUM</div>
  <div id="titlesub">A text adventure game</div>
  <div id="titleprompt">Press any key to begin</div>
  <button id="dysbtn">Dyslexic mode: OFF</button>
</div>
<div id="app">
  <header>
    <div id="location"></div>
    <div id="hud"><b id="hudcp"></b> · <b id="hudap"></b> · <b id="hudres"></b></div>
  </header>

  <div id="story"></div>

  <div id="choices"></div>

  <div id="controls">
    <div id="compass">
      <span></span><button class="dir" id="d-n" data-dir="n">N</button><span></span>
      <button class="dir" id="d-w" data-dir="w">W</button>
      <span></span>
      <button class="dir" id="d-e" data-dir="e">E</button>
      <span></span><button class="dir" id="d-s" data-dir="s">S</button><span></span>
    </div>
    <div id="sidebtns">
      <button class="wide" id="invbtn">Inventory</button>
      <button class="wide" id="grimbtn">Grimoire</button>
      <button class="wide" id="lookbtn">Look around</button>
      <button class="wide" id="journalbtn">Journal</button>
    </div>
  </div>

  <div id="savebar">
    <button class="mini" id="savebtn">Save game</button>
    <button class="mini" id="loadbtn">Load game</button>
  </div>

  <div id="inputrow">
    <input id="cmd" autocomplete="off" spellcheck="false"
           placeholder="What will you do?" />
    <button class="wide" id="go">Do it</button>
  </div>
</div>

<!-- journal window -->
<div id="journal" hidden>
  <div id="journalbox">
    <div id="journalhead">
      <span>Journal</span>
      <button id="journalclose" title="Close">✕</button>
    </div>
    <textarea id="journaltext"
      placeholder="Your own notes. Whatever you write here is kept."></textarea>
    <div id="journalfoot">Saved automatically.</div>
  </div>
</div>

<!-- inventory window: notes, items, consumables, crystals -->
<div id="invwin" hidden>
  <div id="invbox">
    <div id="invhead">
      <span>Inventory</span>
      <button id="invclose" title="Close">✕</button>
    </div>
    <div id="invtabs">
      <button class="tabbtn active" data-tab="invtab_items">Items</button>
      <button class="tabbtn" data-tab="invtab_notes">Notes</button>
      <button class="tabbtn" data-tab="invtab_consum">Consumables</button>
      <button class="tabbtn" data-tab="invtab_crystal">Crystals</button>
    </div>
    <ul id="invtab_items" class="tablist"></ul>
    <ul id="invtab_notes" class="tablist" hidden></ul>
    <ul id="invtab_consum" class="tablist" hidden></ul>
    <ul id="invtab_crystal" class="tablist" hidden></ul>
  </div>
</div>

<!-- glyph description tooltip: must live at page level, outside any
     window, so it shows while the grimoire is open -->
<div id="glyphtip"></div>

<!-- hand picker: opened by clicking a holdable item in the inventory -->
<div id="handwin" hidden>
  <div id="handbox">
    <div id="handtitle"></div>
    <div id="handbody"></div>
    <div id="handbtns"></div>
  </div>
</div>

<!-- grimoire window: offensive, defensive, field -->
<div id="grimwin" hidden>
  <div id="grimbox">
    <div id="grimhead">
      <span>Grimoire</span>
      <button id="grimclose" title="Close">✕</button>
    </div>
    <div id="grimtabs">
      <button class="tabbtn active" data-tab="grimtab_off">Offensive</button>
      <button class="tabbtn" data-tab="grimtab_def">Defensive</button>
      <button class="tabbtn" data-tab="grimtab_field">Field</button>
    </div>
    <ul id="grimtab_off" class="tablist"></ul>
    <ul id="grimtab_def" class="tablist" hidden></ul>
    <ul id="grimtab_field" class="tablist" hidden></ul>
  </div>
</div>

<script>
/* ============================================================
   PART 1 — YOUR STORY DATA  (everything you write goes here)
   ============================================================

   HOW TO WRITE, IN SHORT:
   - ROOMS: one entry per place. "exits" link rooms together.
   - ITEMS: things the player can examine and (sometimes) take.
   - NPCS: characters. Talking to one triggers a DIALOGUE.
   - DIALOGUES: branching conversations with numbered choices.
   - TRIGGERS: reactions to "use X", "open X", custom words.

   Text can be plain, or an array of paragraphs. You can use
   [b]bold[/b] and [i]italic[/i] markers if you like.
   ============================================================ */

const GAME_TITLE = "Asylum: A Text Adventure"; // reserved for the future title screen

const ROOMS = {

  // ------------------------------------------------------------
  // THE ATRIUM — the game's starting room
  // ------------------------------------------------------------
  mansion_atrium: {
    name: "The Atrium",
    desc: [
      "You find yourself standing in the atrium of an extravagant " +
      "mansion. A gold and glass [b]chandelier[/b] hangs above the room.",
      "To the south is a grand staircase with rich mahogany steps " +
      "leading up to the second floor. To the east and west, corridors " +
      "branch off in different directions — you can't see where they " +
      "lead. To the north is a set of great mahogany [b]doors[/b] with " +
      "iron hardware."
    ],
    exits: {
      north: {
        to: "great_hall",          // room behind the doors (to be written)
        requires: "future_key",    // the item that unlocks them (TBD)
        lockedMsg: "The doors are large and heavy. Ornate carvings of " +
                   "vines run along the surface of the wood. You try to " +
                   "push them open, but they're locked shut.",
        unlockedMsg: null
      },
      south: { to: "staircase_landing" },
      east:  { to: "east_corridor" },
      west:  { to: "ballroom" }
    }
  },

  // ------------------------------------------------------------
  // SOUTH — the grand staircase, halfway up
  // ------------------------------------------------------------
  staircase_landing: {
    name: "The Grand Staircase",
    desc: [
      "You walk halfway up the stairs, to the point where they split " +
      "off to the east and west wings of the second floor of the " +
      "mansion. In front of you is a shelf with a " +
      "[b]crystal ball[/b]."
    ],
    exits: {
      north: { to: "mansion_atrium" },  // 'down' the stairs back to the atrium
      east:  { to: "east_wing" }         // 'left' at the top, into the east wing
    }
  },

  // ------------------------------------------------------------
  // SECOND FLOOR, EAST — the walkway over the atrium
  // ------------------------------------------------------------
  east_wing: {
    name: "East Wing",
    desc: [
      "You take a left up the stairs and enter the east wing of the " +
      "second floor. There is a [b]balcony[/b] overlooking the atrium " +
      "to the west, and a shadowy corridor to the east."
    ],
    exits: {
      west: { to: "staircase_landing" },  // back down to the stairs
      north: { to: "east_wing_nook" }    // the far end of the walkway
      // east: the shadowy corridor (to be mapped later)
    }
  },

  // ------------------------------------------------------------
  // SECOND FLOOR — the north end of the east walkway
  // ------------------------------------------------------------
  east_wing_nook: {
    name: "The Reading Nook",
    // the description depends on the direction of approach: the
    // walkway, the passage behind the bookshelf, or a fresh look
    desc: () => {
      // arriving back through the passage, the bookshelf seals itself
      if (arrivalFrom === "ritual_room") return [
        "You exit the ritual room and find yourself back at the " +
        "reading nook. The bookshelf closes behind you."
      ];
      // a fresh look around the room you're standing in
      if (!arrivalFrom) return [
        "You are in the reading nook at the north end of the east " +
        "wing on the second floor. There is a [b]bookshelf[/b] next " +
        "to a comfortable looking [b]leather chair[/b]. Beside the " +
        "chair is a small wooden [b]end table[/b]" +
        (state.taken.includes("lantern")
          ? "."
          : " with a [b]lantern[/b] on it.")
      ];
      // arriving along the walkway from the stairs
      return [
        "You follow the walkway to the north end, where there is a " +
        "[b]bookshelf[/b] and a comfortable looking [b]leather chair[/b]. " +
        "Next to the chair is a small wooden [b]side table[/b]" +
        (state.taken.includes("lantern")
          ? "."
          : " with a [b]lantern[/b] on it.")
      ];
    },
    exits: {
      south: { to: "east_wing" }          // back along the walkway
      // north: behind the bookshelf — only through the passage
    }
  },

  // ------------------------------------------------------------
  // BEHIND THE BOOKSHELF — the ritual room. The grimoire waits
  // here, and the first Entity materializes after it is found.
  // ------------------------------------------------------------
  ritual_room: {
    name: "The Ritual Room",
    desc: [
      "You step into a dimly lit room where you are immediately " +
      "greeted by the faint scent of stale [b]incense[/b]. There is " +
      "a [b]pentacle[/b] painted on the floor, with a candle placed " +
      "at each of its points. In the center of the pentacle is a " +
      "[b]leatherbound book[/b] placed on a small black rug. Beside " +
      "the book is a small [b]quartz[/b] crystal, about the size of " +
      "your thumb."
    ],
    exits: {
      south: { to: "east_wing_nook" }      // back through the passage
    }
  },

  // ------------------------------------------------------------
  // EAST — the corridor to the eastern wing, ground floor
  // ------------------------------------------------------------
  east_corridor: {
    name: "East Corridor",
    desc: [
      "You head down the corridor leading to the eastern wing of the " +
      "mansion's bottom floor. The flickering light of the candles " +
      "casts eerie shadows on the walls and makes the paintings appear " +
      "to shift in strange ways.",
      "There are 3 doors on the right side of the corridor, " +
      "to the south."
    ],
    exits: {

function jumpBalcony() {

    return "There is nothing to jump over here.";

function openPassage() {
  if (state.roomId !== "east_wing_nook") return "There is no armrest here.";
  // solved once = always re-openable; otherwise the player must be sitting
  // in the chair, having just read the red book
  if (!state.flags.puzzleRewarded &&
      !(isSeated() && state.flags.redReadSeated)) {
    return "The armrest feels a bit loose, but nothing happens.";
  }
  state.flags.passageOpen = true;
  // solving the puzzle rewards both channels, once ever
  if (!state.flags.puzzleRewarded) {
    state.flags.puzzleRewarded = true;
    adjustCP(noise(10));
    adjustAP(noise(15));
  }
  return ["You notice the armrest feels a little loose. Something " +
          "inside clicks, and the bookshelf beside you begins to " +
          "move, silently revealing a hidden passage.",
          "Step through? (yes / no)"];
}

function incenseCheck() {
  if (state.roomId !== "ritual_room") return "There is no incense here.";
  if (state.taken.includes("incense_stick"))
    return "The ash tray sits cold and empty in the corner.";
  if (!isHeld("lantern")) {
    // the dark pushes back, harder each time
    if (state.flags.incenseFails) {
      const bleed = 2 + state.flags.incenseFails;
      state.flags.incenseFails++;
      adjustCP(-Math.max(1, noise(bleed))); // always bites
    } else {
      state.flags.incenseFails = 1;
    }
    return "You trace the smell to a certain corner of the room, " +
           "but it's too dark there to see anything." +
           (inInventory("lantern")
             ? " Your lantern would help, if you were holding it." : "");
  }
  paragraphs(["You trace the smell to a certain corner of the room. " +
    "Shining your lantern into the dark corner reveals a small " +
    "stone altar hidden in the shadows. Scattered atop the altar " +
    "are various ritual tools, including a metal tray for burning " +
    "incense. It's full of ash, but there is a fresh stick beside " +
    "it."], "narration");
  say("You have found an item: [b]incense stick[/b] — boosts " +
      "resonance by 30 for a few turns. (Consumable: use it, and " +
      "it's gone.)", "system");
  takeItem("incense_stick");
  return null;
}

function useIncense() {
  const idx = state.inventory.indexOf("incense_stick");

   archive and the karmic drain. Defensive glyphs protect or restore

const GLYPH_TABS = {
  khal: "offensive", reve: "offensive", telos: "offensive",
  cord: "offensive", karm: "offensive", reco: "offensive",
  rewe: "defensive", shiel: "defensive",

};

const DIRNAMES = { n:"north", s:"south", e:"east", w:"west", u:"up", d:"down" };
const DIRWORDS = {
  north:"n", south:"s", east:"e", west:"w", up:"u", down:"d",
  n:"n", s:"s", e:"e", w:"w", u:"u", d:"d"
};

/* Normalize room exits: accept both long (north) and short (n) keys. */
(function normalizeExits() {
  Object.keys(ROOMS).forEach(id => {
    const r = ROOMS[id];
    if (!r.exits) return;
    const norm = {};
    Object.keys(r.exits).forEach(k => {
      norm[DIRWORDS[k] || k] = r.exits[k];
    });
    r.exits = norm;
  });
})();

function fmt(text) {
  if (Array.isArray(text)) return text.map(fmt);
  return String(text)
    .replace(/\[b\]/g, "<b>").replace(/\[\/b\]/g, "</b>")
    .replace(/\[i\]/g, "<i>").replace(/\[\/i\]/g, "</i>");
}

/* ---------- glitch text (low coherence) ----------
   As coherence falls, rendered text corrupts into zalgo: combining
   diacritics stack above and below letters. Milder tiers FLICKER —
   a letter flashes glitched for a moment, then settles clean. From
   ~38CP down, some corruption becomes permanent. At 16CP it
   spreads to the HUD. Only the player's view of the world frays —
   markup, entities, spaces, and their own typed echo are untouched. */
const ZALGO_MARKS = [];
for (let u = 0x0300; u <= 0x036F; u++) ZALGO_MARKS.push(String.fromCharCode(u));

function zalgoMarks(max) {
  let marks = "";
  const n = 1 + Math.floor(Math.random() * max);
  for (let i = 0; i < n; i++) {
    marks += ZALGO_MARKS[Math.floor(Math.random() * ZALGO_MARKS.length)];
  }
  return marks;
}

/* tiers ramp linearly within their CP range: at the top of a tier
   the previous tier's values continue, at the bottom the next peak */
function glitchTier(cp) {
  if (cp >= 50) return null;
  const ramp = (hi, lo, a, b) => a + (b - a) * ((hi - cp) / (hi - lo));
  if (cp >= 39) return { p: 0.10, marks: 1, flick: 1.0 };
  if (cp >= 24) return { p: ramp(38, 24, 0.10, 0.25),
                         marks: Math.round(ramp(38, 24, 1, 3)),
                         flick: ramp(38, 24, 0.7, 0.4) };
  if (cp >= 17) return { p: ramp(23, 17, 0.25, 0.50),
                         marks: Math.round(ramp(23, 17, 3, 5)),
                         flick: ramp(23, 17, 0.4, 0.3) };
  if (cp >= 9)  return { p: ramp(16, 9, 0.50, 0.75),
                         marks: Math.round(ramp(16, 9, 5, 10)),
                         flick: ramp(16, 9, 0.3, 0.2) };
  if (cp >= 1)  return { p: ramp(8, 1, 0.75, 0.90),
                         marks: Math.round(ramp(8, 1, 10, 15)),
                         flick: ramp(8, 1, 0.2, 0.1) };
  return { p: 0.99, marks: 20, flick: 0 };
}

function glitchify(html, tOverride) {
  const t = tOverride || glitchTier(state.cp);
  // death is the one thing the field never gets to distort
  if (!t || state.dead) return html;
  let inTag = false, inEntity = false, out = "";
  for (const c of html) {
    if (inTag) {
      out += c;
      if (c === ">") inTag = false;
      continue;
    }
    if (inEntity) {
      out += c;
      if (c === ";") inEntity = false;
      continue;
    }
    if (c === "<") { inTag = true; out += c; continue; }
    if (c === "&") { inEntity = true; out += c; continue; }
    if (/\w/.test(c) && Math.random() < t.p) {
      const marks = zalgoMarks(t.marks);
      out += (Math.random() < t.flick)
        ? '<span class="flk" data-clean="' + c + '">' + c + marks + '</span>'
        : c + marks;
    } else {
      out += c;
    }
  }
  return out;
}

/* the interface begins to sicken at 20CP: flickers only at first,
   permanence scaling in fast; the echo follows at 9CP, also ramped */
function chromeTier() {
  const cp = state.cp;
  const gt = glitchTier(cp);
  if (!gt || cp > 20) return null;
  const scale = Math.min(1, (20 - cp) / 11);        // full strength by 9
  const flick = Math.max(0.2, 1 - (20 - cp) / 6);   // flicker-only at first
  return { p: gt.p * scale, marks: gt.marks, flick: flick };
}

function echoTier() {
  const cp = state.cp;
  const gt = glitchTier(cp);
  if (!gt || cp > 9) return null;
  const scale = Math.min(1, (9 - cp) / 8);
  return { p: gt.p * scale, marks: gt.marks, flick: gt.flick };
}

function say(html, cls) {
  const p = document.createElement("p");
  if (cls) p.className = cls;
  // say() is the single place [b]/[i] markers are converted
  const body = Array.isArray(html) ? html.map(fmt).join("") : fmt(html);
  p.innerHTML = glitchify(body);
  // flickering letters flash glitched, then settle clean
  p.querySelectorAll("span.flk").forEach(sp => {
    setTimeout(() => { sp.textContent = sp.dataset.clean; },
               300 + Math.floor(Math.random() * 1200));
  });
  storyEl.appendChild(p);
  storyEl.scrollTop = storyEl.scrollHeight;
}

function paragraphs(texts, cls) {
  // accept either a single string or an array of strings
  const arr = Array.isArray(texts) ? texts : [texts];
  arr.forEach(t => say(t, cls));
}

function room() { return ROOMS[state.roomId]; }

/* where the player is standing (null = the middle of the room).
   Anywhere but the leather chair means they are no longer sitting in it. */
function setAt(id) {
  if (state.flags.sitting && id !== "leather_chair") {
    state.flags.sitting = false;
    say("You get up from the chair.", "system");
  }
  state.at = id;
  if (id !== "leather_chair") {
    state.flags.sitting = false;
    state.flags.redReadSeated = false;   // the read only counts while seated
  }
}
function isSeated() {
  return !!state.flags.sitting && state.at === "leather_chair";
}

function itemsHere() {
  return Object.keys(ITEMS).filter(id => {
    const it = ITEMS[id];
    if (it.take) return it.startsIn === state.roomId && !state.taken.includes(id);
    return it.fixedIn === state.roomId;
  });
}

function inInventory(id) { return state.inventory.includes(id); }

/* the room the player just arrived from (null on a fresh look) —
   lets room descriptions vary by direction of approach */
let arrivalFrom = null;

function enterRoom(id) {
  const prevRoomId = state.roomId;
  arrivalFrom = (prevRoomId && prevRoomId !== id) ? prevRoomId : null;
  if (prevRoomId && prevRoomId !== id) {
    state.path.push(prevRoomId);
    const firstVisit = !state.visited.includes(id);
    // a room with a single exit can only ever be left the one way —
    // forced movement is never punished. Otherwise, excessive looping
    // of the same room CHANCES a coherence hit: low odds at first,
    // ramping with each pass — and each landed hit hits harder
    const prevRoom = ROOMS[prevRoomId];
    const forcedExit = prevRoom &&
      Object.keys(prevRoom.exits || {}).length === 1;
    if (!firstVisit && !forcedExit) {
      if (!state.revisited.includes(id)) state.revisited.push(id);
      const count = state.revisitCounts[id] = (state.revisitCounts[id] || 0) + 1;
      if (count >= 3) {
        const chance = Math.min(1, 0.15 * (count - 2));
        if (Math.random() < chance) {
          const hit = (state.loopHits[id] = (state.loopHits[id] || 0) + 1);
          adjustCP(-Math.max(1, noise(hit))); // always bites
        }
      }
    }
  }
  if (!state.visited.includes(id)) state.visited.push(id);
  state.roomId = id;
  state.painting = false; // leaving the studio puts the brush down
  setAt(null);             // entering a room puts you in the middle of it
  state.doorChoice = null; // and away from any numbered-door choice
  const r = room();
  locEl.textContent = r.name;
  storyEl.innerHTML = "";
  say("— " + r.name.toUpperCase() + " —", "room-title");
  // desc can be an array of paragraphs, or a function returning one
  const desc = typeof r.desc === "function" ? r.desc() : r.desc;
  paragraphs(desc, "narration");
  const here = itemsHere(); // found only through the player's own eyes
  const npcNames = (r.npcs || []).map(nid => NPCS[nid] ? NPCS[nid].name : null)
                                 .filter(Boolean);
  if (npcNames.length) {
    say("A [b]" + npcNames.join("[/b] and a [b]") + "[/b] is here.", "system");
  }
  updateCompass();
  setMusic(id);
  // itemless rooms are engaged by walking through them
  checkRoomCleared(id);
}

function updateCompass() {
  const exits = room().exits || {};
  document.querySelectorAll(".dir").forEach(b => {
    const d = b.dataset.dir;
    b.disabled = !exits[d];
    b.classList.toggle("active", !!exits[d]);
  });
}

/* the scripted first encounter: the Entity materializes on the first
   prompt after the grimoire is found — typed or not — and re-forms
   here if the player tries to slip out of the ritual room first */
function checkFirstEncounter() {
  if (state.roomId === "ritual_room" && state.flags.grimoireFound &&
      !state.flags.entitySpawned && !state.dead) {
    state.flags.entitySpawned = true;
    spawnEntity();
    return true;
  }
  return false;
}

function tryExit(dir) {
  // locked in combat: there is no fleeing a field engagement
  if (state.enemy) return "You are locked in combat and cannot flee.";
  // leaving the ritual room right after the grimoire still counts
  if (checkFirstEncounter()) return null;
  const exits = room().exits || {};
  const ex = exits[dir];
  if (!ex) return "You can't go that way.";
  // while choosing doors, going north turns you back into the room
  if (state.doorChoice && dir === "n") {
    state.doorChoice = null;
    enterRoom(state.roomId);
    return null;
  }
  // a "doors" exit: the player must pick which door
  if (ex.to === "doors") return doorPrompt(state.roomId);
  if (ex.requires && !state.unlocked.includes(state.roomId + ":" + dir)) {
    if (inInventory(ex.requires)) {
      state.unlocked.push(state.roomId + ":" + dir);
      if (ex.unlockedMsg) paragraphs(ex.unlockedMsg, "system");
    } else {
      return ex.lockedMsg || "The way is barred.";
    }
  }
  enterRoom(ex.to);
  return null;
}

/* ---------- music ---------- */
const musicA = new Audio();
const musicB = new Audio();
musicA.loop = true; musicB.loop = true;
let currentTrack = null;
let activeEl = musicA;
let fadeTimer = null;

function fadeTo(el, target, done) {
  const step = 0.05;
  clearInterval(fadeTimer);
  fadeTimer = setInterval(() => {
    if (el.volume > target) {
      el.volume = Math.max(0, el.volume - step);
    } else {
      el.volume = Math.min(1, el.volume + step);
      if (el.volume >= target) { clearInterval(fadeTimer); if (done) done(); }
    }
  }, 100);
}

function trackFor(roomId) {
  if (!Object.keys(MUSIC).length) return null;
  return MUSIC[roomId] || MUSIC._default || null;
}

function setMusic(roomId) {
  const track = trackFor(roomId);
  if (!track) return;
  if (track === currentTrack) return;
  currentTrack = track;
  // crossfade: fade the old element out, the new one in
  const oldEl = activeEl;
  const newEl = (activeEl === musicA) ? musicB : musicA;
  activeEl = newEl;
  newEl.src = MUSIC_DIR + track;
  newEl.volume = 0;
  newEl.play().catch(() => {}); // if blocked, first user gesture will start it
  if (!oldEl.paused) fadeTo(oldEl, 0, () => oldEl.pause());
  fadeTo(newEl, 1);
}

/* browsers block audio until the user interacts; if the very first
   play() attempt was blocked, retry on later gestures until it takes */
function firstGesture() {
  if (!gameStarted) return;
  if (!currentTrack) { setMusic(state.roomId); return; }
  if (activeEl.paused) activeEl.play().catch(() => {});
}
document.addEventListener("pointerdown", firstGesture);
document.addEventListener("keydown", firstGesture);

/* ---------- notes ---------- */
/* Notes are found organically, never by typing their titles:
   - foundWith: the item the note is hidden in/with. The note is
     collected automatically the first time the player examines
     that item (e.g. a note tucked inside a desk).
   - Or, for special cases, a TRIGGER can hand it over by calling
     collectNote("note_key") directly. */

function renderNotes() {
  const list = invLists.notes;
  list.innerHTML = "";
  const noteItems = state.inventory.filter(id => itemTab(id) === "notes");
  if (!state.notes.length && !state.sheets.length && !noteItems.length) {
    const li = document.createElement("li");
    li.textContent = "(none found yet)";
    li.style.cursor = "default";
    li.style.color = "var(--dim)";
    list.appendChild(li);
    return;
  }
  state.notes.forEach(id => {
    const li = document.createElement("li");
    li.textContent = NOTES[id].name;
    li.title = "Click to read";
    li.onclick = () => showNote(id);
    list.appendChild(li);
  });
  noteItems.forEach(id => list.appendChild(buildItemRow(id)));
  state.sheets.forEach(id => {
    const li = document.createElement("li");
    li.textContent = "\u266A " + SHEETS[id].name + " (sheet music)";
    li.title = "Click to play";
    li.onclick = () => submitCommand("play " + SHEETS[id].name, false);
    list.appendChild(li);
  });
}

function showNote(id) {
  const n = NOTES[id];
  say("— " + n.name.toUpperCase() + " —", "room-title");
  paragraphs(n.text, "narration");
}

function findNote(words) {
  // only notes ALREADY FOUND are searchable. An unfound note can never
  // be summoned by guessing its title — it must be discovered first.
  const candidates = state.notes.slice();
  const num = (words.join(" ").match(/\d+/) || [null])[0];
  // keywords: meaningful words the player actually typed (a number
  // alone is NOT enough — with several note categories, the title's
  // keyword decides)
  const kw = words.filter(w =>
    w.length > 2 && !/^\d+$/.test(w) &&
    !["read","note","notes","the","a","take","get","grab","pick","look",
       "examine","x","inspect","check"].includes(w));
  if (!kw.length) return null;
  return candidates.find(id => {
    const nm = NOTES[id].name.toLowerCase();
    const numOk = !num || nm.includes(num);
    return numOk && kw.some(w => nm.includes(w));
  });
}

function collectNote(id) {
  if (!state.notes.includes(id)) {
    state.notes.push(id);
    renderNotes();
    adjustAP(noise(5)); // lore items steady alignment
    say("You found: [b]" + NOTES[id].name + "[/b]. It is kept in your " +
        "Notes list, and can be reread at any time.", "system");
  }
  showNote(id);
}

/* ---------- coherence & alignment ---------- */
const hudEl  = document.getElementById("hud");
const hudCP  = document.getElementById("hudcp");
const hudAP  = document.getElementById("hudap");
const hudRES = document.getElementById("hudres");

/* interface chrome that the corruption spreads into below 16CP */
const chromeEls = (() => {
const els = ["lookbtn", "journalbtn", "savebtn", "loadbtn", "go",
             "invbtn", "grimbtn"]
  .map(i => document.getElementById(i));
  document.querySelectorAll(
    ".dir, #journalhead span, #journalfoot, " +
    "#invhead span, #grimhead span"
  ).forEach(e => els.push(e));
  els.forEach(e => { e.dataset.orig = e.textContent; });
  return els;
})();

function renderStats() {
  hudCP.textContent = "Coherence " + state.cp + "%";
  hudAP.textContent = "Alignment " + state.ap + "%";
  // resonance: your field's average (4-way with the enemy in combat)
  hudRES.textContent = "Resonance " + Math.round(resonance()) + "%";
  // the alarm red deepens continuously as coherence falls to 0
  const t = state.cp < 25 ? 1 - state.cp / 25 : 0;
  hudEl.classList.toggle("low", t > 0);
  if (t > 0) {
    const col = "rgb(217," +
      Math.round(138 - 78 * t) + "," +
      Math.round(138 - 78 * t) + ")";
    hudCP.style.color = col;
    hudAP.style.color = col;
    hudRES.style.color = col;
  } else {
    hudCP.style.color = "";
    hudAP.style.color = "";
    hudRES.style.color = "";
  }
  // from 20CP down the corruption spreads into the interface itself:
  // flickers only at first, permanence scaling in fast. It recedes
  // if coherence is restored
  const ct = chromeTier();
  chromeEls.forEach(e => {
    if (!ct) { e.textContent = e.dataset.orig; return; }
    e.innerHTML = glitchify(e.dataset.orig, ct);
    e.querySelectorAll("span.flk").forEach(sp => {
      setTimeout(() => { sp.textContent = sp.dataset.clean; },
                 300 + Math.floor(Math.random() * 1200));
    });
  });
}
function adjustCP(delta) {
  state.cp = Math.max(0, Math.min(100, Math.round(state.cp + delta)));
  renderStats();
}
function adjustAP(delta) {
  state.ap = Math.max(0, Math.min(100, Math.round(state.ap + delta)));
  renderStats();
}

/* every cast value carries noise, and noise is field noise: its
   magnitude is governed by RESONANCE — the 4-way average of your
   coherence & alignment and your opponent's (or your own 2-way
   average outside combat). A coherent field is a QUIET field:
   high resonance pulls noise down to ±1–3, while low resonance
   lets it swell to a cap of ±11, on a continuous ramp */
/* a direct hit to the pool (↯ zhahd, resonance spagyrics...) does
   not bounce back instantly: the distortion persists and averages
   back out over roughly 5 turns */
function resonance() {
  // Ӝ reso can pin the pool in place for a few turns
  if (state.resLock && state.resLock.turns > 0)
    return state.resLock.value;
  const base = state.enemy
    ? (state.cp + state.ap + state.enemy.cp + state.enemy.ap) / 4
    : (state.cp + state.ap) / 2;
  return Math.max(0, Math.min(100, base - state.resDist));
}
function resonanceBase() {
  return state.enemy
    ? (state.cp + state.ap + state.enemy.cp + state.enemy.ap) / 4
    : (state.cp + state.ap) / 2;
}
function tickResonance() {
  if (state.resLock) {
    state.resLock.turns--;
    if (state.resLock.turns <= 0) {
      // lock released: the gap becomes distortion that eases back off
      state.resDist = Math.round(resonanceBase() - state.resLock.value);
      state.resLock = null;
    }
    renderStats();
    return;
  }
  if (!state.resDist) return;
  state.resDist = Math.round(state.resDist * 0.8);
  if (Math.abs(state.resDist) < 1) state.resDist = 0;
  renderStats();
}
function noiseCeiling() {
  const r = resonance();
  return Math.max(3, Math.min(11, Math.round(11 - 8 * (r / 100))));
}
const noise = n => {
  const mag = 1 + Math.floor(Math.random() * noiseCeiling());
  const out = n + (Math.random() < 0.5 ? -mag : mag);
  // field noise can zero a value, never flip its sign
  return n >= 0 ? Math.max(0, out) : Math.min(0, out);
};

function alignMult(ap) {
  if (ap < 25) return 0.5;
  if (ap < 60) return 1;
  if (ap < 80) return 1.5;
  if (ap < 100) return 2;
  return 2.5;
}

/* ---------- glyphs & the cast pipeline ---------- */
function glyphCostText(g) {
  const parts = [];
  if (g.costCP) parts.push(g.costCP + " CP");
  if (g.costAP) parts.push(g.costAP + " AP");
  // costs paid in something other than CP/AP (e.g. rmem drains the pool)
  if (g.costNote) parts.push(g.costNote);
  return parts.length ? " (" + parts.join(", ") + ")" : " (free)";
}

function learnGlyph(id) {
  if (state.grimoire.includes(id)) return false;
  state.grimoire.push(id);
  renderGrimoire();
  say("You have learned the glyph [b]" + GLYPHS[id].glyph + " " +
      GLYPHS[id].phonetic + "[/b] — " + GLYPHS[id].name + ".", "system");
  return true;
}

function attemptCast(id) {
  const g = GLYPHS[id];
  if (!g || !state.grimoire.includes(id)) {
    return say("You don't know that glyph yet.", "system");
  }
  // costs are exact; only effects carry field noise
  const costCP = g.costCP, costAP = g.costAP;
  // a cast beyond your means still costs you something — and the turn
  if (state.cp < costCP || state.ap < costAP) {
    adjustCP(-1); adjustAP(-1);
    const lacking = [];
    if (state.cp < costCP) lacking.push("CP");
    if (state.ap < costAP) lacking.push("AP");
    return say("Cast failed: Not enough " + lacking.join(" and ") +
               ". The failed cast costs your turn.", "system");
  }
  // karm can't be cast at full alignment: there is nowhere for the
  // stolen alignment to flow, so the glyph is simply not castable
  if (g.effect === "karmic" && state.ap >= 100) {
    return say("⌯ Your alignment is already at its ceiling — the " +
               "karmic link has nowhere to flow. The glyph cannot " +
               "be cast.", "system");
  }
  // the alignment multiplier is read BEFORE the cast's AP cost is paid
  const mult = alignMult(state.ap);
  adjustCP(-costCP); adjustAP(-costAP);
  switch (g.effect) {
    case "restore": // ✺ rewe: reweave your field
      adjustCP(noise(g.power * mult));
      say("✺ Your field reweaves. Coherence " + state.cp + "%.", "system");
      break;
    case "ward":    // ⛉ shiel
      if (state.enemy) {
        state.ward = true;
        say("⛉ The ward hums around you.", "system");
      } else {
        say("⛉ The ward hums around you, but nothing comes.", "system");
      }
      break;
    case "discharge": { // ↯ zhahd: siphon resonance into alignment
      const rp = Math.round(resonance());
      const drain = Math.round(rp / 3);       // 33% of the pool
      state.resDist += drain;                 // pool stays drained a while
      const gain = noise(drain);
      adjustAP(gain);
      say("↯ The field discharges: " + gain + " resonance bends into " +
          "your alignment. Alignment " + state.ap + "%.", "system");
      break;
    }
    case "swap": { // Ƨ rmem: coherence and alignment trade places
      // the reversal disturbs the field: half the resonance pool drains
      const drain = Math.round(resonance() / 2);
      state.resDist += drain;
      const t = state.cp;
      state.cp = state.ap;
      state.ap = t;
      renderStats();
      say("Ƨ Flow reverses. Coherence " + state.cp + "%, Alignment " +
          state.ap + "%. Half the resonance pool disperses.",
          "system");
      break;
    }
    case "stabilize": // Ӝ reso: pin the pool in place
      state.resLock = { value: Math.round(resonance()), turns: 3 };
      renderStats();
      say("Ӝ Resonance steadies, pinned at " +
          Math.round(resonance()) + "% for the next few turns.", "system");
      break;
    default:
      // enemy-targeting effects need an active encounter (combat build)
      if (!state.enemy) {
        return say("There is nothing here to cast that upon.", "system");
      }
      castGlyphOnEnemy(id, mult);
      break;
  }
}

function renderGrimoire() {
  // the grimoire window is only reachable once the grimoire is found
  const btn = document.getElementById("grimbtn");
  btn.style.display = state.grimoire.length ? "" : "none";
  // rebuild all three category lists on every change
  Object.values(grimLists).forEach(l => { l.innerHTML = ""; });
  if (!state.grimoire.length) {
    const li = document.createElement("li");
    li.textContent = "(none learned yet)";
    li.style.cursor = "default";
    li.style.color = "var(--dim)";
    grimLists.offensive.appendChild(li);
    return;
  }
  // glyphs removed from the game (old saves) are silently dropped and
  // default to the field tab if they have no category
  state.grimoire.filter(id => GLYPHS[id]).forEach(id => {
    const g = GLYPHS[id];
    const li = document.createElement("li");
    li.textContent = g.glyph + " " + g.phonetic + " — " + g.name +
                     glyphCostText(g);
    li.onclick = () => {
      if (tipSuppressed) return;
      closeGrim();   // the window gets out of the way so the cast is visible
      submitCommand(g.phonetic, false);
    };
    // hovering 1s shows the glyph's description; so does a 1s
    // long-press on mobile
    attachTip(li, () => glyphTipHtml(id));
    grimLists[GLYPH_TABS[id] || "field"].appendChild(li);
  });
}

/* ---------- glyph tooltip ----------
   One floating box, shared by every glyph entry. Desktop: hover.
   Mobile: press and hold 1s. It never swallows taps: a plain
   tap still casts, a held press reads instead. */
const glyphTip = document.getElementById("glyphtip");
const GLYPH_TIP_DELAY = 1000; // ms of hover / press before it opens
let tipHideTimer = null;
let tipOpen = false;      // the tooltip is currently displayed
let tipSuppressed = false; // the tap that just long-pressed: no cast

function glyphTipHtml(id) {
  const g = GLYPHS[id];
  const cost = glyphCostText(g).replace(/[()]/g, "").trim();
  return "<b>" + g.glyph + " " + g.name + "</b>" +
    (cost ? " <i>(" + cost + ")</i>" : "") +
    "<br>" + g.desc;
}
function itemTipHtml(id, hint) {
  const it = ITEMS[id];
  const where = handOf(id) ? " <i>(" + handOf(id) + " hand)</i>" : "";
  return "<b>" + it.name + "</b>" + where + "<br>" +
    (it.examine || "You see nothing special about it.") +
    (hint ? "<br><i>" + hint + "</i>" : "");
}
/* wires hover (1s) / long-press (1s) on a list row to the shared
   tooltip. getHtml() is called when the box opens, so it is current. */
function attachTip(li, getHtml) {
  li.classList.add("glyphrow");
  let hoverTimer = null, pressTimer = null;
  li.addEventListener("mouseenter", () => {
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => showTip(li, getHtml()), GLYPH_TIP_DELAY);
  });
  li.addEventListener("mouseleave", () => {
    clearTimeout(hoverTimer);
    hideGlyphTip();
  });
  li.addEventListener("touchstart", () => {
    clearTimeout(pressTimer);
    hideGlyphTip();
    pressTimer = setTimeout(() => showTip(li, getHtml()), GLYPH_TIP_DELAY);
  }, { passive: true });
  li.addEventListener("touchmove", () => {
    clearTimeout(pressTimer);
    hideGlyphTip();
  }, { passive: true });
  li.addEventListener("touchcancel", () => clearTimeout(pressTimer));
  li.addEventListener("touchend", (e) => {
    clearTimeout(pressTimer);
    if (tipOpen) {
      // a long-press that opened the tooltip must not also click;
      // the box stays up briefly so it can be read after lifting
      e.preventDefault();
      tipSuppressed = true;   // belt and braces: no click after a long-press
      setTimeout(() => { tipSuppressed = false; }, 500);
      clearTimeout(tipHideTimer);
      tipHideTimer = setTimeout(hideGlyphTip, 4000);
    }
  });
  // stop the browser's own long-press menu / text selection
  li.addEventListener("contextmenu", e => e.preventDefault());
}
function showTip(li, html) {
  glyphTip.innerHTML = html;
  glyphTip.style.display = "block";
  const r = li.getBoundingClientRect();
  let left = Math.max(8, Math.min(r.left, window.innerWidth - 310));
  let top = r.bottom + 6;
  if (top + glyphTip.offsetHeight > window.innerHeight - 8)
    top = Math.max(8, r.top - glyphTip.offsetHeight - 6);
  glyphTip.style.left = left + "px";
  glyphTip.style.top = top + "px";
  tipOpen = true;
}

function hideGlyphTip() {
  clearTimeout(tipHideTimer);
  glyphTip.style.display = "none";
  tipOpen = false;
}

/* ---------- combat ----------
   Both sides run the same mirror math: costs with noise, failure
   chance from coherence shifted by alignment, alignment multipliers.
   The enemy's stats are never shown. Combat ends when either side's
   coherence reaches 0; the player acts first, the enemy answers
   after every command. */
function spawnEntity(opts) {
  const o = opts || {};
  // the field announces its creature one of two ways
  const arrival = [
    "A chill runs down your spine that stops you cold. A slimy " +
    "black mist creeps into form in front of you, coalescing into " +
    "a vaguely humanoid shape that shifts and morphs like liquid " +
    "smoke.",
    "You feel something breathing down your neck. You turn around " +
    "to wisps of black smoke pooling together and coalescing into " +
    "a vaguely humanoid form that shifts and shimmers like liquid."
  ];
  paragraphs(arrival[Math.floor(Math.random() * arrival.length)],
             "narration");
  say("You have encountered an [b]" + (o.name || "Entity") + "[/b].",
      "system");
  state.enemy = {
    name: o.name || "Entity",
    cp: (o.cp !== undefined) ? o.cp : 25,
    ap: (o.ap !== undefined) ? o.ap : 0,
    cap: (o.cap !== undefined) ? o.cap : 25,
    glyphs: o.glyphs || ["khal"],
    skipTurn: false,
    ward: false
  };
  drawGrimoire();
  say("— Your turn —", "system");
}

function recordCast(caster, id) {
  state.lastCast = { caster: caster, id: id };
}

/* ---------- random encounters ---------- */
/* a random entity coalesces from the field while the player is
   exploring an uncleared room. The weaker the player's coherence,
   the more the field leaks in. Encounters only reach the player
   after the grimoire is found. */
function randomEncounterCheck() {
  if (!state.flags.grimoireFound) return;
  if (state.enemy || state.dead || state.meditating) return;
  // never mid-interaction: painting, a door choice, a conversation
  if (state.painting || state.doorChoice || activeDialogue) return;
  const rid = state.roomId;
  if (state.clearedRooms.includes(rid)) return;
  // rooms with nothing to engage have no "uncleared" state
  const interactables = Object.keys(ITEMS).filter(i =>
    ITEMS[i].fixedIn === rid ||
    (ITEMS[i].take && ITEMS[i].startsIn === rid));
  if (!interactables.length) return;
  // 3% at full coherence, rising to 13% as it breaks down
  const chance = 0.03 + (100 - state.cp) * 0.001;
  if (Math.random() >= chance) return;
  spawnRandomEntity();
}

function spawnRandomEntity() {
  // khal, rewe, and one more drawn from the field at random
  const pool = Object.keys(GLYPHS).filter(g =>
    g !== "telos" && g !== "reco");
  const third = pool[Math.floor(Math.random() * pool.length)];
  spawnEntity({ cp: 25, ap: 0, cap: 25,
                glyphs: ["khal", "rewe", third] });
}

/* ---------- meditation ---------- */
function startMeditation() {
  if (state.enemy) {
    return say("You cannot find stillness with an Entity facing you.",
               "system");
  }
  // stillness takes time to gather again: once every 30 turns
  if (state.turns - state.lastMeditate < 30) {
    return say("You meditated recently. Your field needs time to " +
               "settle again.", "system");
  }
  state.meditating = true;
  return say("Meditate here? Yes/no", "system");
}

function doMeditate() {
  state.meditating = false;
  paragraphs("You sit down and close your eyes, slowing your field " +
    "and finding clarity in the stillness.", "narration");
  // an uncleared room almost guarantees an interruption; a room
  // cleared on the first visit is almost always safe. Before the
  // grimoire is found, nothing in the field reaches the player.
  const rid = state.roomId;
  let risk;
  if (!state.clearedRooms.includes(rid)) risk = 0.85;
  else if (state.clearedFirstTry.includes(rid)) risk = 0.05;
  else risk = 0.25;   // cleared, but only after a revisit
  if (!state.flags.grimoireFound) risk = 0;
  if (Math.random() < risk) {
    paragraphs("The stillness is broken.", "narration");
    spawnRandomEntity();
    return;
  }
  const gain = noise(25);
  adjustCP(gain);
  state.lastMeditate = state.turns;   // the cooldown begins now
  say("You rise restored. Coherence " + state.cp + "%.", "system");
}

function checkCombatEnd() {
  const en = state.enemy;
  if (!en) return;
  if (en.cp <= 0) {
    say("The Entity has lost its stream of coherence and returned " +
        "to the field.", "system");
    state.enemy = null;
    state.ward = false;
    state.playerSkip = false;
    state.lastCast = null;
    stowGrimoire();
    return;
  }
  if (state.cp <= 0) {
    // in combat, a broken stream is death
    state.enemy = null;
    stowGrimoire(true);
    state.ward = false;
    state.playerSkip = false;
    state.dead = true;
    paragraphs("Your stream of coherence has been broken. Your " +
      "awareness disperses back into the field.", "narration");
    say("Reincarnate? (yes/no)", "system");
  }
}

/* the player's cast lands on the enemy */
function castGlyphOnEnemy(id, mult) {
  const g = GLYPHS[id];
  const en = state.enemy;
  switch (g.effect) {
    case "attack": { // ⟁ khal
      if (en.ward) {
        en.ward = false;
        say("Your glyph shatters against the Entity's ward.",
            "system");
        break;
      }
      const dmg = noise(g.power * mult);
      en.cp = Math.max(0, en.cp - dmg);
      if (g.apGain) adjustAP(noise(g.apGain)); // stacks on success
      say(g.glyph + " The glyph lands — the Entity takes " + dmg +
          " damage.", "system");
      break;
    }
    case "archive": { // 𐜄 reco: catalog the enemy's last cast
      const drain = noise(g.power);
      en.cp = Math.max(0, en.cp - drain);
      if (state.lastCast && state.lastCast.caster === "enemy") {
        const glyphId = state.lastCast.id;
        if (!state.grimoire.includes(glyphId)) {
          learnGlyph(glyphId);
        } else {
          say("The glyph is already inscribed in your grimoire.",
              "system");
        }
      } else {
        say("The archive finds no glyph to catalog.", "system");
      }
      say("Ƨ drains " + drain + " coherence from the Entity.",
          "system");
      break;
    }
    case "reverse": { // ⇋ revé: turn the last cast glyph back
      const lc = state.lastCast;
      if (lc && lc.caster === "enemy" &&
          GLYPHS[lc.id].effect === "attack") {
        const dmg = noise(GLYPHS[lc.id].power * mult);
        en.cp = Math.max(0, en.cp - dmg);
        say("⇋ The reversal turns the glyph back — the Entity takes " +
            dmg + " damage.", "system");
      } else {
        say("⇋ The reversal finds nothing to turn.", "system");
      }
      break;
    }
    case "telos": // ⌖ télos: collapse, outright
      en.cp = 0;
      state.cp = 100;   // restored outright
      state.ap = 0;     // alignment destroyed
      renderStats();
      say("⌖ Télos. The Entity's coherence was severed.",
          "system");
      break;
    case "tempo": // ⧗ tempo: lock the enemy's time
      en.skipTurn = true;
      say("⧗ The Entity's field locks — its next turn passes.",
          "system");
      break;
    case "severance": { // 𓌷 cord: cut a glyph out of its grimoire
      if (en.ward) {
        en.ward = false;
        say("Your glyph shatters against the Entity's ward.",
            "system");
        break;
      }
      // only real glyphs can be cut; the last one is never severed
      const eKnown = en.glyphs.filter(id => GLYPHS[id]);
      if (eKnown.length > 1) {
        const cut = eKnown[Math.floor(Math.random() * eKnown.length)];
        // gone from its repertoire until it catalogs the glyph again
        en.glyphs = en.glyphs.filter(id => id !== cut);
        say("𓌷 The cord severs — the Entity loses " +
            GLYPHS[cut].glyph + " " + GLYPHS[cut].name + ".", "system");
      } else {
        say("𓌷 The cord snaps, but there is nothing left to sever.",
            "system");
      }
      if (g.apGain) adjustAP(noise(g.apGain));
      break;
    }
    case "karmic": { // ⌯ karm: drain half its alignment into yours
      if (en.ward) {
        en.ward = false;
        say("Your glyph shatters against the Entity's ward.",
            "system");
        break;
      }
      const steal = Math.floor(en.ap / 2);
      en.ap -= steal;
      const gain = noise(steal);
      adjustAP(gain);
      // the link also empties the resonance pool completely
      const drained = Math.max(0, Math.round(resonance()));
      state.resDist += drained;
      renderStats();
      say("⌯ The karmic link pulls " + steal + " of its alignment " +
          "into yours. Alignment " + state.ap + "%.", "system");
      break;
    }
  }
  recordCast("player", id);
  checkCombatEnd();
}

/* the enemy's mind: it reads the field and chooses deliberately.
   A glyph it can't afford is never chosen. The priorities are a
   baseline, not a script — every rule rolls, and sometimes the
   creature acts on pure impulse. */
function enemyChooseGlyph(en) {
  const canCast = id => en.glyphs.includes(id) &&
    en.cp >= GLYPHS[id].costCP && en.ap >= GLYPHS[id].costAP &&
    // karm is not castable at full alignment, same as for the player:
    // there is nowhere for the stolen alignment to flow
    !(GLYPHS[id].effect === "karmic" && en.ap >= en.cap);
  // against your ward it holds back its offensive glyphs (the ones the
  // ward blocks) — usually; 1 turn in 10 it casts into the ward anyway
  const warded = state.ward && Math.random() < 0.9;
  const has = id => canCast(id) &&
    !(warded && WARD_BLOCKED.includes(GLYPHS[id].effect));
  const lc = state.lastCast;
  // pure impulse: a completely unpredictable pick, 1 turn in 10
  if (Math.random() < 0.10) {
    const affordable = en.glyphs.filter(canCast);
    if (affordable.length) {
      return affordable[Math.floor(Math.random() * affordable.length)];
    }
  }
  // 1. reversal: usually it turns your last attack back
  if (lc && lc.caster === "player" &&
      GLYPHS[lc.id].effect === "attack" && has("reve") &&
      Math.random() < 0.8) return "reve";
  // 2. reweave when badly hurt (usually)
  if (en.cp <= en.cap * 0.3 && has("rewe") &&
      Math.random() < 0.85) return "rewe";
  // 4. the desperation finisher (usually, when it's that bad)
  if (en.ap >= 100 && en.cp <= en.cap * 0.2 && has("telos") &&
      Math.random() < 0.7) return "telos";
  // 5. lock the player's time, now and then
  if (has("tempo") && Math.random() < 0.15) return "tempo";
  // 6. ward up when the player is landing hits
  if (!en.ward && has("shiel") &&
      lc && lc.caster === "player" && Math.random() < 0.3)
    return "shiel";
  // 6b. karmic: drain when the player's alignment runs high
  if (state.ap >= 50 && has("karm") &&
      Math.random() < 0.45) return "karm";
  // 6c. severance: cut glyphs away once the player knows too many
  if (state.grimoire.length > 3 && has("cord") &&
      Math.random() < 0.35) return "cord";
  // 6d. reverse flow: trade a fat alignment for coherence
  if (en.ap > en.cp * 2 && has("rmem") &&
      Math.random() < 0.5) return "rmem";
  // 6f. stabilize: settle the field while it's distorted
  if (state.resDist >= 10 && has("reso") &&
      Math.random() < 0.25) return "reso";
  // 7. warded: don't mindlessly attack — settle on anything useful it
  //    can still cast (charge, reweave, ward, lock, swap, stabilize...)
  if (warded) {
    const alt = en.glyphs.filter(has);
    if (alt.length) return alt[Math.floor(Math.random() * alt.length)];
  }
  // 8. default: attack
  return canCast("khal") ? "khal" : en.glyphs.find(canCast) || en.glyphs[0];
}

/* resolve one enemy glyph against the player (mirrors the player's
   own resolution: costs paid up front, ward blocking, then effect) */
function enemyApplyEffect(id, mult) {
  const en = state.enemy;
  const g = GLYPHS[id];
  switch (g.effect) {
    case "attack": { // ⟁ khal
      const dmg = noise(g.power * mult);
      adjustCP(-dmg);
      if (g.apGain) en.ap = Math.min(en.cap, en.ap + noise(g.apGain));
      say("The Entity casts " + g.glyph + ". You take " + dmg +
          " damage. Coherence " + state.cp + "%.", "system");
      break;
    }
    case "restore": // ✺ rewe
      en.cp = Math.min(en.cap, en.cp + noise(g.power * mult));
      say("The Entity casts " + g.glyph + " — its field reweaves.",
          "system");
      break;
    case "archive": { // 𐜄 reco: drains coherence, catalogs your glyph
      const drain = noise(g.power);
      adjustCP(-drain);
      if (state.lastCast && state.lastCast.caster === "player") {
        const seen = state.lastCast.id;
        if (!en.glyphs.includes(seen)) {
          en.glyphs.push(seen);
          say("The Entity's archive catalogs your " +
              GLYPHS[seen].glyph + ".", "system");
        }
      }
      say("Ƨ drains " + drain + " coherence from you.", "system");
      break;
    }
    case "reverse": { // ⇋ revé: your last attack comes back
      const lc = state.lastCast;
      if (lc && lc.caster === "player" &&
          GLYPHS[lc.id].effect === "attack") {
        const dmg = noise(GLYPHS[lc.id].power * mult);
        adjustCP(-dmg);
        say("⇋ The Entity turns your own glyph back — you take " +
            dmg + " damage.", "system");
      } else {
        say("⇋ The Entity's reversal finds nothing to turn.",
            "system");
      }
      break;
    }
    case "ward": // ⛉ shiel
      en.ward = true;
      say("⛉ The Entity wards its field.", "system");
      break;
    case "telos": // ⌖ télos: it all comes down to this
      state.cp = 0;
      en.cp = Math.min(en.cap, 100);
      en.ap = 0;
      renderStats();
      say("⌖ The Entity spends everything. Télos.", "system");
      break;
    case "tempo": // ⧗ tempo: your next turn passes
      state.playerSkip = true;
      say("⧗ Your field locks — your next turn will pass.", "system");
      break;
    case "discharge": { // ↯ zhahd: charges its alignment from the pool
      const drain = Math.round(resonance() / 3);
      state.resDist += drain;
      const gain = noise(drain);
      en.ap = Math.min(en.cap, en.ap + gain);
      say("↯ The Entity siphons resonance into its alignment.", "system");
      break;
    }
    case "severance": { // 𓌷 cord: a glyph is torn from your grimoire
      // only real glyphs can be cut; the last one is never severed
      const known = state.grimoire.filter(id => GLYPHS[id]);
      if (known.length > 1) {
        const cut = known[Math.floor(Math.random() * known.length)];
        // gone from the grimoire until it is learned again
        state.grimoire = state.grimoire.filter(id => id !== cut);
        renderGrimoire();   // the panel must stop listing it right away
        say("𓌷 The cord severs — you lose " + GLYPHS[cut].glyph +
            " " + GLYPHS[cut].name + ". You must learn it again.", "system");
      } else {
        say("𓌷 The cord snaps, but there is nothing left to sever.",
            "system");
      }
      if (g.apGain) en.ap = Math.min(en.cap, en.ap + noise(g.apGain));
      break;
    }
    case "karmic": { // ⌯ karm: drains half your alignment into its own
      const steal = Math.floor(state.ap / 2);
      state.ap -= steal;
      const gain = noise(steal);
      en.ap = Math.min(en.cap, en.ap + gain);
      // the link also empties the resonance pool completely
      const drained = Math.max(0, Math.round(resonance()));
      state.resDist += drained;
      renderStats();
      say("⌯ The karmic link pulls " + steal + " of your alignment " +
          "into its own.", "system");
      break;
    }
    case "swap": { // Ƨ rmem: its coherence and alignment trade places
      // the reversal disturbs the field: half the resonance pool drains
      state.resDist += Math.round(resonance() / 2);
      const t = en.cp;
      en.cp = Math.min(en.cap, en.ap);
      en.ap = Math.min(en.cap, t);
      renderStats();
      say("Ƨ The Entity's flow reverses. Half the resonance pool " +
          "disperses.", "system");
      break;
    }
    case "stabilize": // Ӝ reso: it pins the pool in place
      state.resLock = { value: Math.round(resonance()), turns: 3 };
      renderStats();
      say("Ӝ The Entity steadies the field's resonance.", "system");
      break;
  }
  recordCast("enemy", id);
  checkCombatEnd();
}

/* the enemy's turn: after every player command */
function enemyTurn() {
  const en = state.enemy;
  if (!en) return;
  if (en.skipTurn) {
    en.skipTurn = false;
    say("The Entity's field is locked — it cannot act.", "system");
    return;
  }
  const id = enemyChooseGlyph(en);
  const g = GLYPHS[id];
  // costs are exact; only effects carry field noise
  const costCP = g.costCP, costAP = g.costAP;
  if (en.cp < costCP || en.ap < costAP) {
    // the mirror of desperation: it costs the creature something
    en.cp = Math.max(0, en.cp - 1);
    en.ap = Math.max(0, en.ap - 1);
    say("The Entity reaches for a glyph beyond its means.", "system");
    recordCast("enemy", id);
    return checkCombatEnd();
  }
  // the alignment multiplier is read BEFORE the cast's AP cost is paid
  const mult = alignMult(en.ap);
  en.cp -= costCP;
  en.ap -= costAP;
  // the player's ward blocks every incoming offensive glyph:
  // attacks, severance (cord) and karmic drain (karm)
  if (state.ward && WARD_BLOCKED.includes(g.effect)) {
    state.ward = false;
    say("The Entity casts " + g.glyph + " — the glyph shatters " +
        "against your ward.", "system");
    recordCast("enemy", id);
    return;
  }
  enemyApplyEffect(id, mult);
}

/* one full round: the player's action — typed, clicked, whatever —
   then the field's answer. Every player action routes through here.
   A failed cast costs no turn: the field waits. */
let turnSpent = true;
function runTurn(playerAction) {
  if (state.playerSkip) {
    state.playerSkip = false;
    say("Your field is locked — your turn passes.", "system");
  } else {
    turnSpent = true;
    playerAction();
  }
  // the Entity's ward lasts one turn only: whatever you did, it fades now
  if (state.enemy) state.enemy.ward = false;
  // the resonance pool averages back out, one turn at a time
  tickResonance();
  state.turns++;   // one spent turn has passed
  // dangerously low coherence eats the player's own journal
  corruptJournal();
  // extremely low coherence slowly drains alignment (always bites)
  if (state.cp <= 10) adjustAP(-Math.max(1, noise(1)));
  // the enemy answers every action with a turn of its own
  if (state.enemy) {
    say("— The Entity's turn —", "system");
    enemyTurn();
    // your ward lasts one turn only: it fades after the Entity acts,
    // whether or not it was tested
    state.ward = false;
    tickResonance();
    if (state.enemy && !state.dead) say("— Your turn —", "system");
  }
}

function reincarnate() {
  state.dead = false;
  state.pendingHold = null;
  state.cp = 50;      // awareness gathers back to its starting point
  state.ap = 0;
  state.resDist = 0;
  state.ward = false;
  state.path = [];
  // the Entity is waiting back where it formed: it re-coalesces
  // on your next prompt in the ritual room
  state.flags.entitySpawned = false;
  renderStats();
  // items, glyphs, and notes stay; so does the run's memory
  say("You gather yourself back out of the field, whole again.",
      "system");
  enterRoom("mansion_atrium");
}

/* ---------- room engagement (clears & backtracking) ---------- */
function recordExamined(itemId) {
  const list = state.examined[state.roomId] = state.examined[state.roomId] || [];
  if (!list.includes(itemId)) list.push(itemId);
  checkRoomCleared(state.roomId);
}

function checkRoomCleared(roomId) {
  if (state.clearedRooms.includes(roomId)) return;
  const ids = Object.keys(ITEMS).filter(i =>
    !ITEMS[i].noClear &&
    (ITEMS[i].fixedIn === roomId ||
    (ITEMS[i].take && ITEMS[i].startsIn === roomId)));
  const ex = state.examined[roomId] || [];
  const engaged = ids.every(i => ex.includes(i) || state.taken.includes(i));
  if (!engaged) return;
  // a flawless first visit rewards alignment; clears on a revisit
  // (still possible, still worth something) reward coherence only
  const firstVisitClear = !state.revisited.includes(roomId);
  state.clearedRooms.push(roomId);
  if (firstVisitClear) state.clearedFirstTry.push(roomId);
  if (ids.length) {
    adjustCP(firstVisitClear ? noise(10) : noise(5));
    if (firstVisitClear) adjustAP(noise(15));
  }
}

/* ---------- numbered-door helper ---------- */
function doorPrompt(roomId) {
  // the player now stands before the doors, choosing
  state.doorChoice = roomId;
  const doors = NUMBERED_DOORS[roomId];
  const count = doors ? Object.keys(doors).length : 3;
  return "Before you are " + count + " doors.";
}

/* ---------- painting (art studio puzzle) ---------- */
function normalizePaint(s) {
  s = (" " + s.toLowerCase().trim().replace(/[!?.,;:'"]/g, " ") + " ")
        .replace(/\s+/g, " ").trim();
  s = s.replace(/^paint\s+/, "");
  s = s.replace(/^(the|a|an)\s+/, "");
  // "paint a picture of the mansion" -> "mansion"
  s = s.replace(/^(picture|painting|portrait|image|depiction|rendering|scene|landscape)\s+of\s+/, "");
  s = s.replace(/^(the|a|an)\s+/, "");
  return s;
}

function paintAttempt(input) {
  const norm = normalizePaint(input);
  const entry = PAINTINGS.find(p =>
    p.aliases.some(a => normalizePaint(a) === norm));
  if (!entry) return paragraphs(PAINT_FAIL, "system");
  paragraphs(entry.text, "system");
  // a painting realized for the first time steadies the field;
  // repeated subjects earn nothing, but failed experiments are free
  // (keyed by first alias, so reordering PAINTINGS won't break saves)
  const key = entry.aliases[0];
  if (!state.painted.includes(key)) {
    state.painted.push(key);
    adjustCP(noise(5));
    adjustAP(noise(10));
  }
  if (entry.correct) {
    // hook for the real puzzle answer, once written
    state.flags.paintingSolved = true;
  }
}

/* ---------- drawers ---------- */
function handleDrawers(words) {
  const set = DRAWERS[state.roomId];
  if (!set) return say("There are no drawers here.", "system");

  // furniture named in the command: "open dresser top drawer",
  // "open bottom drawer of the nightstand"...
  const furns = Object.keys(set).filter(k => k !== "note");
  const named = furns.find(k => {
    const n = ITEMS[k].name.toLowerCase();
    return words.includes(n) ||
           n.split(" ").some(w => words.includes(w) && w.length > 2);
  });

  // resolve the target: named furniture wins, else whatever the
  // player is standing at, else the room's only piece with drawers
  let f = named || furns.find(k => k === state.at);
  if (!f && furns.length === 1) f = furns[0];
  if (!f) {
    return say("Open the drawers of which piece of furniture? (" +
               furns.map(k => "the " + ITEMS[k].name).join(" or ") + ")",
               "system");
  }
  if (state.at !== f) {
    setAt(f); // naming the piece walks you over to it
    say("You walk over to the [b]" + ITEMS[f].name + "[/b].", "system");
  }

  const furn = set[f];
  const drawers = furn.drawers;
  const num = Object.keys(drawers).find(n =>
    drawers[n].names.some(nm => words.includes(nm)));
  if (!num) return say("Which drawer would you like to open?", "system");

  // a room-level note: which of the room's drawers hides it is rolled
  // once, then fixed for the rest of the run (never respawns once found)
  if (set.note) {
    if (state.drawerNotes[state.roomId] === undefined) {
      const all = [];
      for (const kf of Object.keys(set)) {
        if (kf === "note") continue;
        for (const n of Object.keys(set[kf].drawers)) all.push(kf + ":" + n);
      }
      state.drawerNotes[state.roomId] =
        all[Math.floor(Math.random() * all.length)];
    }
    if (state.drawerNotes[state.roomId] === f + ":" + num &&
        !state.notes.includes(set.note)) {
      paragraphs("You found a note:", "system");
      return collectNote(set.note);
    }
  }

  const dr = drawers[num];
  // hidden loot: each drawer, cabinet, or other searchable gets one
  // roll — sticky for the rest of the run, never respawns once found
  const loot = rollSearchLoot(state.roomId + ":" + f + ":" + num);
  if (loot) {
    state.drawerLoot[state.roomId + ":" + f + ":" + num] = null;
    paragraphs((dr && dr.text) || EMPTY_DRAWER, "system");
    paragraphs("Tucked inside, you have found an item: [b]" +
               ITEMS[loot].name + "[/b].", "system");
    takeItem(loot);
    return;
  }
  return paragraphs((dr && dr.text) || EMPTY_DRAWER, "system");
}

/* every searchable object (drawer, cabinet...) rolls once for hidden
   loot the first time it is searched: a spagyric of clarity or an
   incense stick. The roll is fixed for the rest of the run. */
function rollSearchLoot(key) {
  if (!(key in state.drawerLoot)) {
    const r = Math.random();
    state.drawerLoot[key] = r < 0.10 ? "spagyric_clarity"
                       : r < 0.20 ? "incense_stick"
                       : null;
  }
  const loot = state.drawerLoot[key];
  if (!loot) return null;
  return loot;
}

/* ---------- proximity: standing at furniture ---------- */
function approachTarget(words) {
  return itemsHere().find(id => {
    const n = ITEMS[id].name.toLowerCase();
    return words.includes(n) ||
           n.split(" ").some(w => words.includes(w) && w.length > 2);
  });
}

/* ---------- pool reset ---------- */
/* Clears every pool door's sticky room assignment. Found items and
   notes persist; pool doors re-roll on their next open. Story data
   can call resetPools() from any item's onExamine or a TRIGGER. */
function resetPools() {
  state.doorAssignments = {};
}

/* ---------- inventory ---------- */
/* ---------- sheet music ---------- */
function collectSheet(id, itemId) {
  if (state.sheets.includes(id)) return false;
  state.sheets.push(id);
  if (itemId) state.taken.push(itemId);
  say("You have found sheet music for \u201C" + SHEETS[id].name +
      "\u201D.", "system");
  adjustAP(noise(5)); // lore items steady alignment
  renderInventory();
  checkRoomCleared(state.roomId); // taking it may finish the room
  return true;
}

function playSong(id) {
  const sheet = SHEETS[id];
  // performing a song for the first time — in this room, on this
  // instrument — steadies coherence; repeats earn nothing
  const instr = (state.roomId === "ballroom") ? "organ" : "piano";
  const key = id + ":" + state.roomId + ":" + instr;
  if (!state.songsPlayed.includes(key)) {
    state.songsPlayed.push(key);
    adjustCP(noise(10));
  }
  paragraphs(sheet.text || ("You play " + sheet.name + "."), "system");
  if (sheet.file) setMusic("song_" + id); // room music resumes on exit
}

function renderInventory() {
  sanitizeHands();
  // every tab is rebuilt on every change; hidden tabs are cheap
  // (the notes tab is owned by renderNotes, which also shows sheet music)
  const bagLists = [invLists.items, invLists.consum, invLists.crystal];
  bagLists.forEach(l => { l.innerHTML = ""; });
  renderNotes();
  const empty = !state.inventory.some(id => itemTab(id) !== "notes");
  if (empty) {
    bagLists.forEach(l => {
      const li = document.createElement("li");
      li.textContent = "(empty)";
      li.style.cursor = "default";
      li.style.color = "var(--dim)";
      l.appendChild(li);
    });
    return;
  }
  state.inventory.filter(id => itemTab(id) !== "notes").forEach(id => {
    invLists[itemTab(id)].appendChild(buildItemRow(id));
  });
}
/* ---------- inventory rows ----------
   Hover or long-press (1s) shows the item's description. Clicking a
   holdable item opens the hand picker; other items act as before. */
function buildItemRow(id) {
  const it = ITEMS[id];
  const li = document.createElement("li");
  li.textContent = it.name + (handOf(id) ? " (" + handOf(id) + " hand)" : "");
  const nm = it.name.toLowerCase();
  let hint, run;
  if (it.spagyric) {
    hint = "Click to drink"; run = () => submitCommand("drink " + nm, false);
  } else if (it.incense) {
    hint = "Click to light"; run = () => submitCommand("light " + nm, false);
  } else if (isHoldable(id)) {
    hint = handOf(id) ? "Click to put away" : "Click to hold in a hand";
    run = () => openHandPicker(id);
  } else {
    hint = "Click to examine"; run = () => submitCommand("examine " + nm, false);
  }
  li.onclick = () => { if (!tipSuppressed) run(); };
  attachTip(li, () => itemTipHtml(id, hint));
  return li;
}

/* hand picker: a small box with Left / Right buttons */
const handWin = document.getElementById("handwin");
const handTitle = document.getElementById("handtitle");
const handBody = document.getElementById("handbody");
const handBtns = document.getElementById("handbtns");
let handItem = null, handCloseTimer = null;
function setHandBox(title, body, buttons) {
  handTitle.textContent = title;
  handBody.textContent = body;
  handBtns.innerHTML = "";
  buttons.forEach(b => {
