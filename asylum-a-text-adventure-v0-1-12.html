    const btn = document.createElement("button");
    btn.className = "wide";
    btn.textContent = b.label;
    btn.onclick = b.fn;
    if (b.disabled) btn.disabled = true;
    handBtns.appendChild(btn);
  });
}
function openHandPicker(id) {
  state.pendingHold = null; // the box replaces the typed question
  handItem = id;
  hideGlyphTip();
  clearTimeout(handCloseTimer);
  renderHandChoice();
  handWin.hidden = false;
}
function closeHandPicker() {
  clearTimeout(handCloseTimer);
  handWin.hidden = true;
  handItem = null;
}
function renderHandChoice() {
  const id = handItem;
  const cur = handOf(id);
  if (cur) {
    setHandBox("Your " + ITEMS[id].name,
      "You are holding it in your " + cur + " hand.", [
        { label: "Put away", fn: () => { unequip(id); closeHandPicker(); } },
        { label: "Cancel", fn: closeHandPicker }
      ]);
    return;
  }
  const lab = h => (h === "left" ? "Left hand" : "Right hand") +
    (state.hands[h] ? " (" + yourItem(state.hands[h]) + ")" : "");
  setHandBox("Which hand?", "Hold " + theItem(id) + " in:", [
    { label: lab("left"),  fn: () => pickHand("left"),
      disabled: grimoireLocked() },
    { label: lab("right"), fn: () => pickHand("right") },
    { label: "Cancel", fn: closeHandPicker }
  ]);
}
function pickHand(hand) {
  if (hand === "left" && grimoireLocked()) {
    return setHandBox("Which hand?", grimoireBlock(),
      [{ label: "Back", fn: renderHandChoice }]);
  }
  const id = handItem, old = state.hands[hand];
  if (old) {
    setHandBox("Which hand?", "You are already holding " + yourItem(old) +
      " in that hand. Replace it with " + theItem(id) + "?", [
        { label: "Replace", fn: () => finishPick(hand) },
        { label: "Keep it", fn: renderHandChoice }
      ]);
    return;
  }
  finishPick(hand);
}
function finishPick(hand) {
  const msg = commitHold(handItem, hand);
  setHandBox("Which hand?", msg, []);
  handCloseTimer = setTimeout(closeHandPicker, 1200);
}
handWin.addEventListener("click", e => { if (e.target === handWin) closeHandPicker(); });

/* ---------- hands & equipping ----------
   Carrying something is not holding it. Items flagged hold: true (the
   lantern) and crystals are held in the left or right hand: "equip
   lantern" asks "Which hand?"; an occupied hand asks before replacing. */
const HAND_WORDS = { left: "left", l: "left", right: "right", r: "right" };
function isHoldable(id) {
  return !!(ITEMS[id] && (ITEMS[id].hold || ITEMS[id].crystal));
}
function handOf(id) {
  return state.hands.left === id ? "left"
       : state.hands.right === id ? "right" : null;
}
function isHeld(id) { return handOf(id) !== null; }
/* The grimoire is not an inventory item: combat draws it into the
   left hand automatically and keeps it there until the fight ends. */
const GRIMOIRE = "grimoire";
function itemName(id) { return id === GRIMOIRE ? "grimoire" : ITEMS[id].name; }
function theItem(id)  { return "the " + itemName(id); }
function yourItem(id) { return "your " + itemName(id); }
function grimoireLocked() { return state.hands.left === GRIMOIRE; }
// anything that left the inventory is no longer in a hand
function sanitizeHands() {
  ["left", "right"].forEach(h => {
    const id = state.hands[h];
    if (id && id !== GRIMOIRE && !state.inventory.includes(id))
      state.hands[h] = null;
  });
}
// combat begins: whatever is in the left hand is put away
function drawGrimoire() {
  if (!state.flags.grimoireFound || grimoireLocked()) return;
  state.pendingHold = null;
  closeHandPicker();
  const prev = state.hands.left;
  state.handStash = prev || null;
  state.hands.left = GRIMOIRE;
  say(prev ? "You put " + yourItem(prev) + " away and draw your grimoire " +
             "in your left hand."
           : "You draw your grimoire in your left hand.", "system");
  renderInventory();
}
// combat is over: the grimoire closes and the left hand gets its item back
function stowGrimoire(quiet) {
  if (!grimoireLocked()) return;
  const prev = state.handStash;
  state.handStash = null;
  state.hands.left = (prev && state.inventory.includes(prev) &&
                      state.hands.right !== prev) ? prev : null;
  if (!quiet) {
    say(state.hands.left
      ? "You close your grimoire and take up " + yourItem(state.hands.left) +
        " again in your left hand."
      : "You close your grimoire.", "system");
  }
  renderInventory();
}
function grimoireBlock() {
  return "Your left hand is holding your grimoire while you are in combat.";
}
function handsText() {
  const l = state.hands.left, r = state.hands.right;
  if (!l && !r) return "Your hands are empty.";
  if (l && r) return "You are holding " + yourItem(l) +
    " in your left hand and " + yourItem(r) + " in your right hand.";
  return l ? "You are holding " + yourItem(l) + " in your left hand. " +
             "Your right hand is empty."
           : "You are holding " + yourItem(r) + " in your right hand. " +
             "Your left hand is empty.";
}
function startEquip(id, hand) {
  if (!inInventory(id)) {
    return say(itemsHere().includes(id)
      ? "You'll need to pick up " + theItem(id) + " first."
      : "You don't have " + theItem(id) + ".", "system");
  }
  if (!isHoldable(id)) {
    return say("You can't hold " + theItem(id) + " in your hand.", "system");
  }
  const cur = handOf(id);
  if (cur) {
    return say("You are already holding " + yourItem(id) + " in your " +
               cur + " hand.", "system");
  }
  if (!hand) {
    state.pendingHold = { stage: "hand", item: id };
    return say("Which hand?", "system");
  }
  placeInHand(id, hand);
}
function placeInHand(id, hand) {
  if (hand === "left" && grimoireLocked()) return say(grimoireBlock(), "system");
  const old = state.hands[hand];
  if (old) {
    state.pendingHold = { stage: "replace", item: id, hand: hand };
    return say("You are already holding " + yourItem(old) +
      " in that hand. Replace it with " + theItem(id) + "?", "system");
  }
  commitHold(id, hand);
}
function commitHold(id, hand) {
  const old = state.hands[hand];
  state.pendingHold = null;
  state.hands[hand] = id;
  renderInventory();
  const msg = old ? "You put " + yourItem(old) + " away and hold " +
                    theItem(id) + " in your " + hand + " hand."
                  : "You hold it in your " + hand + " hand.";
  say(msg, "system");
  return msg;
}
function unequip(id, hand) {
  state.pendingHold = null;
  const hands = hand ? [hand] : ["left", "right"].filter(h => state.hands[h]);
  let targets = hands.filter(h => state.hands[h] && (!id || state.hands[h] === id));
  if (targets.some(h => state.hands[h] === GRIMOIRE)) {
    // the grimoire cannot be put away mid-fight; anything else can
    targets = targets.filter(h => state.hands[h] !== GRIMOIRE);
    if (!targets.length) return say(grimoireBlock(), "system");
    say(grimoireBlock(), "system");
  }
  if (!targets.length) {
    if (id) return say("You aren't holding " + theItem(id) + ".", "system");
    return say(hand ? "Your " + hand + " hand is already empty."
                    : "Your hands are already empty.", "system");
  }
  targets.forEach(h => {
    say("You put " + yourItem(state.hands[h]) + " away.", "system");
    state.hands[h] = null;
  });
  renderInventory();
}
// answers to the pending equip prompt; returns true if it consumed input
function answerEquipPrompt(input) {
  const p = state.pendingHold;
  const t = input.replace(/[.,!?;:]/g, " ")
    .replace(/\b(the|my|your|in|on|hand|please)\b/g, " ")
    .replace(/\s+/g, " ").trim();
  if (/^(cancel|never ?mind|forget it|stop)$/.test(t)) {
    state.pendingHold = null;
    say("You decide not to.", "system");
    return true;
  }
  if (!inInventory(p.item)) { state.pendingHold = null; return false; }
  if (p.stage === "hand") {
    if (HAND_WORDS[t]) { state.pendingHold = null; placeInHand(p.item, HAND_WORDS[t]); return true; }
  } else {
    if (/^(yes|y|yeah|yep|ok|okay|sure)$/.test(t)) { commitHold(p.item, p.hand); return true; }
    if (/^(no|n|nope)$/.test(t)) {
      const old = state.hands[p.hand];
      state.pendingHold = null;
      say("You keep holding " + yourItem(old) + ".", "system");
      return true;
    }
  }
  // anything else abandons the question and is read as a normal command
  state.pendingHold = null;
  return false;
}
// "equip lantern", "hold the quartz in my left hand", "unequip right"
function equipCommand(verb, words) {
  let hand = null;
  const rest = [];
  const skip = ["in", "on", "my", "your", "the", "a", "an", "hand", "with", "to", "it"];
  words.slice(1).forEach(w => {
    if (w === "left" || w === "right") hand = w;
    else if (!skip.includes(w)) rest.push(w);
  });
  if (rest.length > 1 && HAND_WORDS[rest[rest.length - 1]] &&
      rest[rest.length - 1].length === 1) {
    hand = HAND_WORDS[rest.pop()];
  }
  const unequipVerb = ["unequip", "unhold", "unwield", "lower", "stow"].includes(verb);
  if (unequipVerb) {
    if (!rest.length || rest.some(w => ["all", "everything", "hands"].includes(w))) {
      return unequip(null, hand);
    }
  } else if (!rest.length) {
    return say("Equip what?", "system");
  }
  const m = n => { n = n.toLowerCase();
    return rest.join(" ") === n ||
           n.split(" ").some(w => rest.includes(w) && w.length > 2); };
  const id = state.inventory.find(i => m(ITEMS[i].name)) || findItem(rest);
  if (!id) return say("You don't have that.", "system");
  return unequipVerb ? unequip(id, hand) : startEquip(id, hand);
}

/* ---------- debug cheat: give <item> ----------
   Matches an item, note or sheet music by id or name (exact first,
   then partial) and files it in the right inventory tab. No coherence
   or alignment changes, no room-cleared checks. */
function cheatGive(query) {
  const q = query.trim();
  const catalog = [];
  Object.keys(ITEMS).forEach(id => { if (ITEMS[id].take)
    catalog.push({ kind: "item", id, name: ITEMS[id].name }); });
  Object.keys(NOTES).forEach(id =>
    catalog.push({ kind: "note", id, name: NOTES[id].name }));
  Object.keys(SHEETS).forEach(id =>
    catalog.push({ kind: "sheet", id, name: SHEETS[id].name }));
  if (!q) {
    return say("give what? Try: " +
      catalog.map(c => c.name).join(", "), "system");
  }
  const norm = t => String(t).toLowerCase();
  const exact = c => norm(c.id) === q || norm(c.name) === q;
  const partial = c => norm(c.id).includes(q) || norm(c.name).includes(q);
  const hits = catalog.filter(exact);
  const found = hits.length ? hits : catalog.filter(partial);
  if (!found.length) {
    const fixed = Object.keys(ITEMS).find(id => !ITEMS[id].take &&
      (norm(id) === q || norm(ITEMS[id].name).includes(q)));
    return say(fixed ? "(cheat) " + ITEMS[fixed].name + " cannot be carried."
                     : "(cheat) no item matches \u201C" + q + "\u201D.",
               "system");
  }
  if (found.length > 1) {
    return say("(cheat) ambiguous, matches: " +
      found.map(c => c.name).join(", "), "system");
  }
  const c = found[0];
  if (c.kind === "item") {
    if (state.inventory.includes(c.id))
      return say("(cheat) you already have the " + c.name + ".", "system");
    state.inventory.push(c.id);
    if (!state.taken.includes(c.id)) state.taken.push(c.id);
    renderInventory();
    say("(cheat) " + c.name + " added to " + itemTab(c.id) + ".", "system");
  } else if (c.kind === "note") {
    if (state.notes.includes(c.id))
      return say("(cheat) you already have that note.", "system");
    state.notes.push(c.id);
    renderNotes();
    say("(cheat) note \u201C" + c.name + "\u201D added to notes.", "system");
  } else {
    if (state.sheets.includes(c.id))
      return say("(cheat) you already have that sheet music.", "system");
    state.sheets.push(c.id);
    renderInventory();
    say("(cheat) sheet music \u201C" + c.name + "\u201D added to notes.",
        "system");
  }
}

function takeItem(id) {
  state.taken.push(id);
  state.inventory.push(id);
  adjustCP(noise(3)); // finding items steadies coherence
  renderInventory();
  checkRoomCleared(state.roomId);
}

/* ---------- dialogue ---------- */
let activeDialogue = null; // set while a conversation is running

function startDialogue(dialogueId) {
  const d = DIALOGUES[dialogueId];
  if (!d) return say("They have nothing to say.", "system");
  activeDialogue = dialogueId;
  showNode(d.first);
}

function showNode(key) {
  const d = DIALOGUES[activeDialogue];
  const node = d.nodes[key];
  if (!node) return endDialogue();
  paragraphs(node.text, "speech");
  choicesEl.innerHTML = "";
  node.choices.forEach(ch => {
    const b = document.createElement("button");
    b.textContent = ch.say;
    b.onclick = () => {
      say("> " + ch.say, "choice-picked");
      if (ch.reply) paragraphs(ch.reply, "system");
      if (ch.next) showNode(ch.next);
      else endDialogue();
    };
    choicesEl.appendChild(b);
  });
  storyEl.scrollTop = storyEl.scrollHeight;
}

function endDialogue() {
  activeDialogue = null;
  choicesEl.innerHTML = "";
}

/* ---------- parser ---------- */
function findItem(words) {
  const match = id => {
    const n = ITEMS[id].name.toLowerCase();
    return words.includes(n) ||
           n.split(" ").some(w => words.includes(w) && w.length > 2);
  };
  // what's actually in the room (or carried) always wins over a
  // same-named object elsewhere in the mansion
  const ids = Object.keys(ITEMS);
  return itemsHere().find(match) ||
         ids.filter(id => state.inventory.includes(id)).find(match) ||
         ids.find(match);
}
function findNpc(words) {
  return Object.keys(NPCS).find(id =>
    NPCS[id].name.toLowerCase().split(" ").some(w => words.includes(w) && w.length > 2));
}

/* ---------- flexible phrasings ----------
   The exact-phrase TRIGGERS cover the common wordings; this covers the
   rest, room by room. It receives the punctuation-stripped command and
   returns true when it handled it (false lets normal parsing go on). */
const READ_LOOK_VERBS = /^(read|look at|look|examine|inspect|check|open|view|study|browse|peruse|skim|flip through|leaf through|look through|take a look at|have a look at|x)\b/;
const NOOK_BOOKS = [
  { id: "constellations", re: /\bconstellations?\b/ },
  { id: "stranger",       re: /\bstranger\b/ },
  { id: "red",            re: /\b(red|thick|untitled)\b/ }
];
const BARE_BOOK_TITLE = /^(the |a )?(book )?(called |titled )?(constellations?|(the )?stranger( in the mirror)?|(untitled )?(thick )?red( book)?|(untitled )?thick book|untitled book)$/;
const CANVAS_RE = /\b(canvas|canvases|easel)\b/;

function nookBookId(s) {
  const b = NOOK_BOOKS.find(b => b.re.test(s));
  return b ? b.id : null;
}

/* "put paint on the canvas", "apply some paint to canvas", "use the
   brush on the canvas", "paint on the canvas", "paint the canvas" */
function isCanvasPaintPhrase(s) {
  if (/^(put|apply|add|spread|smear|dab|splash|spatter|dip|use|touch|press)\b/.test(s) &&
      /\b(paints?|brush|paintbrush|palette|colou?rs?)\b/.test(s) &&
      CANVAS_RE.test(s)) return true;
  const m = s.match(/^paint\s+(.*)$/);
  return !!(m && /^(on |onto |upon |at )?(the |a |an |this |my )?(canvas|canvases|easel)$/.test(m[1]));
}

/* the standard "examine" result for an item in the room */
function examineHere(item) {
  const it = ITEMS[item];
  setAt(item);
  recordExamined(item);
  paragraphs(it.examine || "You see nothing special about it.", "system");
  if (typeof it.onExamine === "function") it.onExamine();
  Object.keys(NOTES).forEach(nid => {
    if (NOTES[nid].foundWith === item && !state.notes.includes(nid)) {
      collectNote(nid);
    }
  });
}

function interpretNatural(clean, words) {
  const out = res => { if (res) paragraphs(res, "system"); return true; };

  // ---- the reading nook: books, the chair, the side table's drawer ----
  if (state.roomId === "east_wing_nook") {
    const bookId = nookBookId(clean);
    // "sit in the chair and read a book" (any wording with both)
    if (/\b(sit|sat|sitting|seat)\b/.test(clean) && /\b(read|reading)\b/.test(clean)) {
      paragraphs(sitChair(), "system");
      if (bookId) readBook(bookId);
      else paragraphs(bookMenu(), "system");
      return true;
    }
    // "look at constellations", "examine the thick red book",
    // "read the stranger in the mirror in the reading nook"
    if (bookId && (READ_LOOK_VERBS.test(clean) ||
        BARE_BOOK_TITLE.test(clean.replace(/^(the|a|an)\s+/, "")))) {
      readBook(bookId);
      return true;
    }
    // no title given: "read a book", "look at the books", "read"
    if (READ_LOOK_VERBS.test(clean) &&
        (/\bbooks?\b/.test(clean) ||
         /^read( something| anything| one| some)?( (from|off|on|in|at) .*)?$/.test(clean) ||
         (/^read\b/.test(clean) && /\b(bookshelf|shelf)\b/.test(clean)))) {
      return out(bookMenu());
    }
    // "examine armrest", "feel the armrest", "pull on the armrest"...
    if (/\barmrests?\b/.test(clean)) return out(openPassage());
    // the side table's drawer, from anywhere in the room
    if (/\bdrawers?\b/.test(clean) ||
        (/^open\b/.test(clean) && /\btable\b/.test(clean))) {
      if (state.at !== "side_table") {
        setAt("side_table");
        say("You walk over to the [b]side table[/b].", "system");
      }
      return out(openNookDrawer());
    }
  }

  // ---- the dark bedroom: the rug hides a pentagram ----
  if (state.roomId === "pool_bedroom" && /\b(rug|carpet)\b/.test(clean) &&
      /^(pick|take|get|grab|lift|raise|move|shift|pull|peel|flip|turn|roll|fold|push|slide|(look|check|search|peek|peer|examine|inspect|x)\s+(under|beneath|underneath|below|behind))\b/.test(clean)) {
    return out(liftRug());
  }

  // ---- furniture with drawers: "open the nightstand", "open dresser" ----
  if (/^open\b/.test(clean) && DRAWERS[state.roomId] &&
      !/\bdrawers?\b/.test(clean)) {
    const set = DRAWERS[state.roomId];
    const named = Object.keys(set).filter(k => k !== "note").some(k => {
      const n = ITEMS[k].name.toLowerCase();
      return words.includes(n) ||
             n.split(" ").some(w => words.includes(w) && w.length > 2);
    });
    if (named) { handleDrawers(words); return true; }
  }

  // ---- the art studio: painting ----
  if (isCanvasPaintPhrase(clean)) return out(startPainting());
  const pm = clean.match(/^paint\s+(.+)$/);
  if (pm) {
    if (state.roomId !== "pool_art_studio") return out(startPainting());
    paintAttempt(clean);   // "paint a rainbow", "paint the mansion"
    return true;
  }

  // ---- the atrium doors ("mahogany doors", "great doors"...) ----
  if (state.roomId === "mansion_atrium" && /\bdoors?\b/.test(clean)) {
    // go/walk/run/head through (or into) the doors, open/push/pull them
    if (/^(open|push|pull|shove|force|unlock|try|enter|knock)\b/.test(clean) ||
        /^(go|walk|run|head|step|move)\b.*\b(through|into|in)\b/.test(clean)) {
      return out(tryExit("n"));
    }
    // go/walk/run/head up to the doors
    if (/^(go|walk|run|head|move|step|approach)\b/.test(clean)) {
      setAt("doors");
      return out("You walk over to the [b]" + ITEMS.doors.name + "[/b].");
    }
    // look at / examine them, or just type their name
    const rest = clean.replace(/^(look at|look|examine|inspect|check|x|view|study|search)\s+/, "")
                      .replace(/^(the|a|an)\s+/, "");
    if (rest !== clean || /^((great|big|large|heavy|mahogany|iron|double|north)\s+)*doors?$/.test(rest)) {
      examineHere("doors");
      return true;
    }
  }

  return false;
}

function handleCommand(raw) {
  const input = raw.trim().toLowerCase();
  if (!input) return;

  // dialogue mode: allow numbers to pick choices
  if (activeDialogue) {
    const n = parseInt(input, 10);
    const btns = [...choicesEl.children];
    if (btns[n - 1]) return btns[n - 1].click();
    say("Type the number of your choice (1-" + btns.length + ").", "system");
    return;
  }

  // death prompt: only yes or no matter
  if (state.dead) {
    if (input === "yes") return reincarnate();
    if (input === "no") {
      return say("The field holds you. Reincarnate? (yes/no)", "system");
    }
    return say("Reincarnate? (yes/no)", "system");
  }

  // meditation prompt: only yes or no matter
  if (state.meditating) {
    if (input === "yes") return doMeditate();
    if (input === "no") {
      state.meditating = false;
      return say("You decide this might not be the time or place",
                 "system");
    }
    return say("Meditate here? Yes/no", "system");
  }

  // equip prompt ("Which hand?" / "Replace it?"): answers handled here;
  // anything unrelated drops the question and runs as a normal command
  if (state.pendingHold && answerEquipPrompt(input)) return;

  // punctuation-tolerant copy of the command for phrase matching:
  // "Read a book." and "sit in the chair, and read" parse like plain text
  const clean = input.replace(/["'`\u2018\u2019\u201C\u201D]/g, "")
                     .replace(/[.,!?;:]/g, " ").replace(/\s+/g, " ").trim();
  const words = clean.split(" ");

  // while painting, typed input is the subject being attempted
  if (state.painting) {
    // some commands put the brush down and are handled normally
    if (/^(stop|stop painting|done|finish|put (down )?the (paintbrush|brush)|never mind|n|s|e|w)$/.test(input) ||
        /^(go )?(north|south|east|west|up|down)$/.test(input) ||
        /^(leave|return|go back|back)$/.test(input)) {
      state.painting = false;
      say("You put down the paintbrush.", "system");
      // fall through to normal handling of that command
    } else if (isCanvasPaintPhrase(clean)) {
      return say("You're already at the canvas. What do you want to paint?",
                 "system");
    } else {
      return paintAttempt(input);
    }
  }

  // glyph casting: paste the glyph, type its phonetic, or its name
  const castInput = input.replace(/^cast\s+/, "");
  const castId = Object.keys(GLYPHS).find(g =>
    castInput === GLYPHS[g].glyph ||
    castInput === GLYPHS[g].phonetic ||
    castInput === GLYPHS[g].name);
  if (castId) return attemptCast(castId);

  // bare number picks a door in rooms that have numbered doors
  if (/^\d+$/.test(input) && NUMBERED_DOORS[state.roomId]) {
    return handleCommand("open door " + input);
  }

  // standing before numbered doors: turn back, or pick one
  if (state.doorChoice) {
    if (/^(turn (back|around)|leave|return|go back|back|north|go north|n)$/.test(input)) {
      state.doorChoice = null;
      enterRoom(state.roomId);
      return;
    }
    // any other input abandons the choice and is handled normally
    state.doorChoice = null;
  }

  // "go back" and friends: always return the way you came
  if (/^(turn (back|around)|go back|back|return|leave|retreat)$/.test(input)) {
    if (state.enemy) return say("You are locked in combat and cannot flee.", "system");
    if (state.path.length) {
      const prev = state.path.pop();
      return enterRoom(prev);
    }
    return say("There is nowhere to go back to.", "system");
  }

  // equipping: items are carried in the pack but held in a hand
  if (["equip", "hold", "wield", "unequip", "unhold", "unwield", "lower",
       "stow"].includes(words[0])) {
    return equipCommand(words[0], words);
  }
  if (["hands", "held", "equipped"].includes(words[0]) && words.length === 1) {
    return say(handsText(), "system");
  }

  // debug cheat: "give <item>" drops it straight into the inventory
  if (words[0] === "give") return cheatGive(words.slice(1).join(" "));

  // triggers first (exact phrase)
  const trig = TRIGGERS[input] || TRIGGERS[clean];
  if (trig) {
    const res = trig();
    if (res) paragraphs(res, "system");
    return;
  }

  // flexible phrasings for specific rooms (books, rug, drawers, paint...)
  if (interpretNatural(clean, words)) return;

  const verb = words[0];

  // saving / loading via typed commands too
  if (verb === "save") return saveGame();
  if (verb === "load" || verb === "restore") return loadGame();
  if (verb === "journal") { openJournal(); return; }
  if (verb === "meditate" || verb === "meditation") {
    return startMeditation();
  }
  if (verb === "dyslexic") {
    const on = !document.body.classList.contains("dys");
    setDyslexic(on);
    return say("Dyslexic mode: " + (on ? "ON" : "OFF") + ".", "system");
  }

  // notes: "read note-to-self 1", "read mysterious note", etc.
  // A keyword from the title is required — a number alone won't match.
  if (words.some(w => w.includes("note")) || verb === "read") {
    const note = findNote(words);
    if (note) return collectNote(note);
    if (words.some(w => w.includes("note"))) {
      return say("No note like that is within reach. Try a keyword from " +
                 "its title.", "system");
    }
    // otherwise fall through to other parsers
  }

  // drawers: "open drawer 2", "open the top drawer of the nightstand"...
  if (words.some(w => w.startsWith("drawer"))) {
    return handleDrawers(words);
  }

  // numbered doors: "enter door 2", "open middle door", "go through 3rd door"...
  // (only in rooms that actually have numbered doors)
  if (NUMBERED_DOORS[state.roomId] &&
      words.includes("door") && ["enter","open","go","use","try","through"].some(v => words.includes(v))) {
    const doorNums = { 1:["1","one","first","left"], 2:["2","two","second","middle","center"],
                       3:["3","three","third","right","last"] };
    let picked = null;
    for (const n of Object.keys(doorNums)) {
      if (doorNums[n].some(w => words.includes(w))) { picked = parseInt(n, 10); break; }
    }
    if (picked === null) return say("Which door? (Try: door 1, 2, or 3.)", "system");
    const doors = NUMBERED_DOORS[state.roomId];
    if (!doors) return say("There are no doors here.", "system");
    let dest = doors[picked];

    // "pool" doors: random draw from POOLS, fixed on first open
    if (dest === "pool") {
      const pool = POOLS[state.roomId] || [];
      if (!pool.length) return paragraphs(
        "[FILLER] The door is shut, and does not open. (No pool rooms " +
        "have been written yet.)", "system");
      if (!state.doorAssignments[state.roomId]) state.doorAssignments[state.roomId] = {};
      if (!state.doorAssignments[state.roomId][picked]) {
        // a room can only be drawn once per corridor; once every room
        // in the pool has been used, remaining doors stay shut
        const taken = Object.values(state.doorAssignments[state.roomId]);
        const fresh = pool.filter(r => !taken.includes(r));
        if (!fresh.length) return paragraphs(
          "[TEMP] The door is shut, and does not open. (Every room in " +
          "this corridor's pool has already been drawn — this door " +
          "stays closed until the pool grows.)", "system");
        state.doorAssignments[state.roomId][picked] =
          fresh[Math.floor(Math.random() * fresh.length)];
      }
      dest = state.doorAssignments[state.roomId][picked];
    }

    // a "locked" draw: the door is locked and cannot be opened
    if (dest === "locked") {
      return say("This door is locked and cannot be opened.", "system");
    }

    if (!dest) return paragraphs(
      "[FILLER] The door is shut, and does not open. (This room hasn't " +
      "been written yet — it will open when it is.)", "system");
    return enterRoom(dest);
  }

  // approach furniture: "go to the nightstand", "approach dresser"...
  if (["go","walk","run","head","move","step","stand","approach"].includes(verb) &&
      (verb === "approach" || words.includes("to") || words.includes("at") ||
       words.includes("toward") || words.includes("towards"))) {
    const target = approachTarget(words);
    if (target && !DIRWORDS[words[words.length - 1]]) {
      setAt(target);
      return say("You walk over to the [b]" + ITEMS[target].name + "[/b].", "system");
    }
    // not a furniture target — fall through to movement below
  }

  // movement
  if (["go","walk","run","head","climb","enter"].includes(verb) || DIRWORDS[verb]) {
    const dirWord = DIRWORDS[verb] ? verb : words.find(w => DIRWORDS[w]);
    if (!dirWord) return say("Go where?", "system");
    const res = tryExit(DIRWORDS[dirWord]);
    if (res) paragraphs(res, "system");
    return;
  }

  // examining "doors" in a room with numbered doors asks which door
  if (/^examine|^look|^look at|^inspect|^check|^search|^x\b/.test(input) &&
      /\bdoors?\b/.test(input) && NUMBERED_DOORS[state.roomId]) {
    return say(doorPrompt(state.roomId), "system");
  }

  if (["look","l"].includes(verb) && words.length === 1) {
    enterRoom(state.roomId);
    return;
  }
  if (["look","examine","x","inspect","read","check","search"].includes(verb)) {
    const item = findItem(words.slice(1));
    if (item) {
      const it = ITEMS[item];
      if (!itemsHere().includes(item) && !(it.take && inInventory(item))) {
        return paragraphs("You don't see that here.", "system");
      }
      // examining something in the room puts the player at it
      if (itemsHere().includes(item)) {
        setAt(item);
        recordExamined(item);
      }
      // sheet music: examining it collects it
      if (it.sheet) {
        collectSheet(it.sheet, item);
        return;
      }
      paragraphs(it.examine || "You see nothing special about it.", "system");
      // an item may trigger an action when examined (see onExamine)
      if (typeof it.onExamine === "function") it.onExamine();
      // a note may be hidden with this item — found on examination
      Object.keys(NOTES).forEach(nid => {
        if (NOTES[nid].foundWith === item && !state.notes.includes(nid)) {
          collectNote(nid);
        }
      });
      return;
    }
    const npc = findNpc(words.slice(1));
    if (npc && (room().npcs || []).includes(npc)) {
      return paragraphs(NPCS[npc].examine || "They give you a long look back.", "system");
    }
    return say("You don't see anything like that here.", "system");
  }

  if (["take","get","grab","pick"].includes(verb)) {
    const item = findItem(words.slice(1));
    if (!item) return say("Take what?", "system");
    if (!itemsHere().includes(item)) {
      return paragraphs(inInventory(item)
        ? "You already have the " + ITEMS[item].name + "."
        : "There's no " + ITEMS[item].name + " here.", "system");
    }
    // sheet music is collected, not carried like an object
    if (ITEMS[item].sheet) {
      collectSheet(ITEMS[item].sheet, item);
      return;
    }
    if (!ITEMS[item].take) return paragraphs("The " + ITEMS[item].name +
      " stays where it is. It is part of this place.", "system");
    // hidden items are never taken directly: "take" routes through
    // their own discovery mechanic (the dark corner, the drawer...)
    if (ITEMS[item].hidden && !state.taken.includes(item)) {
      if (typeof ITEMS[item].gate === "function") {
        const gated = ITEMS[item].gate();
        if (gated) paragraphs(gated, "system");
        return;
      }
      return paragraphs("You don't see that here.", "system");
    }
    takeItem(item);
    return paragraphs("Taken: [b]" + ITEMS[item].name + "[/b].", "system");
  }

  // playing instruments and found sheet music
  if (verb === "play") {
    const norm = input.toLowerCase().replace(/^play\s+/, "")
      .replace(/[!?.,;:'"/]/g, "").trim();
    // a song from collected sheet music (piano here, organ in ballroom)
    const songId = Object.keys(SHEETS).find(id =>
      state.sheets.includes(id) &&
      norm.replace(/^the\s+/, "")
          .includes(SHEETS[id].name.toLowerCase()
            .replace(/[!?.,;:'"/]/g, "")));
    if (songId) {
      if (state.roomId === "pool_music_room" || state.roomId === "ballroom") {
        return playSong(songId);
      }
      return say("There is no instrument here to play it on.", "system");
    }
    if (words.includes("guitar")) {
      if (state.roomId !== "pool_music_room") return say("There is no guitar here.", "system");
      return paragraphs("You strum the guitar, but it sounds awful. " +
        "It's out of tune and the strings are rusted.", "system");
    }
    if (words.includes("piano")) {
      if (state.roomId !== "pool_music_room") return say("There is no piano here.", "system");
      const lines = [
        "You pull back the piano bench and take a seat. It makes an odd " +
        "sound as you put your weight on it. Your fingers rest " +
        "comfortably on the cold ivory keys as you think about what " +
        "song you want to play..."
      ];
      // sitting down reveals the sheet on the shelf, once
      const revealed = !state.sheets.includes("astrals_song");
      if (revealed) {
        lines.push("There is a piece of sheet music on the shelf " +
                   "titled \u201CAstral's Song\u201D.");
      }
      paragraphs(lines, "system");
      if (revealed) collectSheet("astrals_song");
      return;
    }
    if (words.includes("organ")) {
      if (state.roomId !== "ballroom") return say("There is no organ here.", "system");
      return paragraphs("You take a seat on the velvet bench, letting " +
        "your eyes wander upward at the enormous pipes as you think " +
        "about what song you want to play...", "system");
    }
    // fall through if the verb matched nothing
  }

  if (["inventory","inv","i","items"].includes(verb) && words.length === 1) {
    const invText = state.inventory.map(id => ITEMS[id].name);
    const sheetText = state.sheets.map(id => "sheet music for \u201C" +
      SHEETS[id].name + "\u201D");
    const all = invText.concat(sheetText);
    if (!all.length) return say("You are carrying nothing.", "system");
    say("You are carrying: " + all.join(", ") + ".", "system");
    if (state.inventory.some(isHoldable)) say(handsText(), "system");
    return;
  }

  if (["talk","speak","ask","greet","hello","hi"].includes(verb)) {
    const npc = findNpc(words.slice(1)) || (room().npcs || [])[0];
    if (npc && (room().npcs || []).includes(npc)) {
      return startDialogue(NPCS[npc].dialogue);
    }
    return say("There is no one here to talk to.", "system");
  }

  if (verb === "use") {
    const item = findItem(words.slice(1));
    if (item && inInventory(item)) {
      return say("Try being more specific: [i]use " + ITEMS[item].name +
        " on something[/i], or examine it.", "system");
    }
    return say("You can't use that.", "system");
  }

  if (["help","?"].includes(verb)) {
    return paragraphs([
      "Commands: go north/south/east/west/up/down · look · examine [thing] · " +
      "take [thing] · go/walk/run to [thing] (stand at furniture) · open [drawer] · " +
      "talk to [someone] · use [thing] · equip [thing] (held in a hand) · read [keyword] · inventory · " +
      "journal · save · load.",
      "On phones, use the compass buttons. On desktop, arrow keys also move you."
    ], "system");
  }

  say("You're not sure how to do that. (Type [i]help[/i] for commands.)", "system");
}

/* ---------- wiring ---------- */
/* the player's own echoed words — they fray at dangerous levels */
function makeEcho(raw) {
  const line = document.createElement("p");
  line.className = "choice-picked";
  const clean = "> " + raw.trim();
  const gt = echoTier();
  if (gt) {
    const esc = clean.replace(/&/g, "&amp;")
                     .replace(/</g, "&lt;")
                     .replace(/>/g, "&gt;");
    line.innerHTML = glitchify(esc);
    line.querySelectorAll("span.flk").forEach(sp => {
      setTimeout(() => { sp.textContent = sp.dataset.clean; },
                 300 + Math.floor(Math.random() * 1200));
    });
  } else {
    line.textContent = clean;
  }
  return line;
}

function echoCommand(raw) {
  storyEl.appendChild(makeEcho(raw));
  storyEl.scrollTop = storyEl.scrollHeight;
}

/* THE one path every player action takes — typed commands, compass
   buttons, arrow keys, the Look button, glyph and inventory clicks.
   A button is just a typed command that doesn't echo itself, so there
   is no behavioral difference between the two. */
function submitCommand(raw, echo) {
  const prevRoom = state.roomId;
  if (echo) echoCommand(raw);
  // the Entity materializes on the first prompt after the grimoire —
  // no matter what that prompt was
  if (checkFirstEncounter()) return;
  runTurn(() => handleCommand(raw));
  // the field leaks in while the player explores an uncleared room
  randomEncounterCheck();
  // if the command moved us to a new room, the room description cleared
  // the echo — re-add it right under the room title
  if (echo && state.roomId !== prevRoom && storyEl.children.length > 1) {
    storyEl.insertBefore(makeEcho(raw), storyEl.children[1]);
  }
}

function doGo() {
  const raw = cmdEl.value;
  if (!raw.trim()) return;
  cmdEl.value = "";
  submitCommand(raw, true);
}

document.getElementById("go").onclick = doGo;
cmdEl.addEventListener("keydown", e => { if (e.key === "Enter") doGo(); });

/* compass buttons and arrow keys: the same as typing the direction */
const DIR_COMMANDS = { n: "north", s: "south", e: "east", w: "west",
                       u: "up", d: "down" };
function moveTurn(dir) {
  submitCommand(DIR_COMMANDS[dir] || dir, false);
}
document.querySelectorAll(".dir").forEach(b =>
  b.addEventListener("click", () => moveTurn(b.dataset.dir)));

document.getElementById("lookbtn").onclick = () => submitCommand("look", false);
document.getElementById("savebtn").onclick = saveGame;
document.getElementById("loadbtn").onclick = loadGame;

/* ---------- journal ---------- */
const JOURNAL_KEY = "asylum_journal_v1";
const journalEl    = document.getElementById("journal");
const journalText  = document.getElementById("journaltext");

function loadJournalText() {
  try {
    journalText.value = localStorage.getItem(JOURNAL_KEY) || "";
  } catch (e) {
    journalText.value = "";
    journalText.placeholder =
      "The journal can't be stored here. It will work once the game is " +
      "hosted or opened as a normal page in a browser.";
  }
}
function saveJournalText() {
  try { localStorage.setItem(JOURNAL_KEY, journalText.value); } catch (e) {}
}
let journalTimer = null;
journalText.addEventListener("input", () => {
  clearTimeout(journalTimer);
  journalTimer = setTimeout(saveJournalText, 500); // autosave, debounced
});

function openJournal() {
  journalEl.hidden = false;
  journalText.focus();
}
function closeJournal() {
  journalEl.hidden = true;
  saveJournalText();
  cmdEl.focus();
}
document.getElementById("journalbtn").onclick = openJournal;
document.getElementById("journalclose").onclick = closeJournal;
journalEl.addEventListener("click", e => { if (e.target === journalEl) closeJournal(); });

/* ---------- inventory + grimoire windows ---------- */
const invEl  = document.getElementById("invwin");
const grimEl = document.getElementById("grimwin");

function openInv() {
  invEl.hidden = false;
  closeGrim();
}
function closeInv() {
  closeHandPicker();
  invEl.hidden = true;
  hideGlyphTip();
  cmdEl.focus();
}
function openGrim() {
  grimEl.hidden = false;
  closeInv();
}
function closeGrim() {
  grimEl.hidden = true;
  hideGlyphTip();
}

/* tab switching: one panel list per tab, others hidden */
function bindTabs(winEl, groups) {
  winEl.querySelectorAll(".tabbtn").forEach(btn => {
    btn.addEventListener("click", () => {
      winEl.querySelectorAll(".tabbtn").forEach(b =>
        b.classList.toggle("active", b === btn));
      winEl.querySelectorAll(".tablist").forEach(l =>
        { l.hidden = true; });
      const target = document.getElementById(btn.dataset.tab);
      if (target) target.hidden = false;
    });
  });
}
bindTabs(invEl, invLists);
bindTabs(grimEl, grimLists);

document.getElementById("invbtn").onclick = openInv;
document.getElementById("invclose").onclick = closeInv;
invEl.addEventListener("click", e => { if (e.target === invEl) closeInv(); });
document.getElementById("grimbtn").onclick = openGrim;
document.getElementById("grimclose").onclick = closeGrim;
grimEl.addEventListener("click", e => { if (e.target === grimEl) closeGrim(); });
document.addEventListener("keydown", e => {
  if (!gameStarted) return;
  if (e.key === "Escape" && !handWin.hidden) return closeHandPicker();
  if (e.key === "Escape" && !journalEl.hidden) closeJournal();
});
loadJournalText();

/* ---------- journal corruption ----------
   Below 10 coherence the field starts eating the player's own
   journal: random letters are permanently replaced by noise. The
   damage is written into the journal itself — only the player can
   repair it, letter by letter. */
const JOURNAL_NOISE = "@#$&_-()=%+?*!~^/\\|<>{}[];:'\",.0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
function corruptJournal() {
  if (state.cp > 10) return;
  // the journal box itself is the source of truth: it holds what the
  // player sees (and what the next save will write), even when browser
  // storage is unavailable or the journal window is closed
  const text = journalText.value;
  if (!text) return;
  // 5% of letters per turn at 10CP, ramping to 20% at 0CP
  const frac = 0.05 + (10 - Math.max(0, state.cp)) * 0.015;
  let out = "", corrupted = 0;
  for (const c of text) {
    if (/[a-zA-Z]/.test(c) && Math.random() < frac) {
      // always a different keyboard character: letter, number or symbol
      let n;
      do { n = JOURNAL_NOISE[Math.floor(Math.random() * JOURNAL_NOISE.length)]; }
      while (n === c);
      out += n;
      corrupted++;
    } else {
      out += c;
    }
  }
  if (!corrupted) return;
  // keep the cursor where the player left it if the journal is open
  const a = journalText.selectionStart, b = journalText.selectionEnd;
  journalText.value = out;
  if (!journalEl.hidden) {
    try { journalText.setSelectionRange(a, b); } catch (e) {}
  }
  // write the damage through, replacing any pending (clean) autosave
  clearTimeout(journalTimer);
  saveJournalText();
}

const KEYMAP = { ArrowLeft: "w", ArrowRight: "e", ArrowUp: "n", ArrowDown: "s" };
document.addEventListener("keydown", e => {
  if (!gameStarted || !journalEl.hidden) return; // not while the journal is open
  const ae = document.activeElement;
  // arrows work from the command line only while it's empty; once you've typed
  // something they edit your text. Other text fields keep their own cursor keys.
  if (ae === cmdEl) { if (cmdEl.value !== "") return; }
  else if (ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT")) return;
  const dir = KEYMAP[e.key];
  if (dir) {
    e.preventDefault(); // keep up/down from scrolling the page
    moveTurn(dir);
  }
});

/* ---------- safety net: show any script error in the story panel ---------- */
window.onerror = function (msg, src, line) {
  const p = document.createElement("p");
  p.style.color = "#d98a8a";
  p.textContent = "[engine error] " + msg + " (line " + line + ")";
  storyEl.appendChild(p);
  return false;
};

/* ---------- title screen & dyslexic mode ---------- */
const titleScreen = document.getElementById("titlescreen");
const dysBtn     = document.getElementById("dysbtn");
const DYS_KEY    = "asylum_dyslexic_v1";
let gameStarted  = false;

function setDyslexic(on) {
  document.body.classList.toggle("dys", on);
  dysBtn.textContent = "Dyslexic mode: " + (on ? "ON" : "OFF");
  try { localStorage.setItem(DYS_KEY, on ? "1" : "0"); } catch (e) {}
}
let dysOn = false;
try { dysOn = localStorage.getItem(DYS_KEY) === "1"; } catch (e) {}
setDyslexic(dysOn);

dysBtn.addEventListener("click", e => {
  e.stopPropagation();
  setDyslexic(!document.body.classList.contains("dys"));
});

function beginGame() {
  if (gameStarted) return;
  gameStarted = true;
  titleScreen.hidden = true;
  enterRoom(state.firstRoom);
}
titleScreen.addEventListener("click", e => {
  if (dysBtn.contains(e.target)) return;
  beginGame();
});
document.addEventListener("keydown", e => {
  if (!titleScreen.hidden) {
    e.preventDefault();
    beginGame();
  }
});

/* ---------- save / load ---------- */
const SAVE_KEY = "asylum_save_v1";

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      roomId: state.roomId,
      inventory: state.inventory,
      // combat is never saved mid-fight: the grimoire goes back
      hands: { left: grimoireLocked() ? state.handStash : state.hands.left,
               right: state.hands.right },
      taken: state.taken,
      unlocked: state.unlocked,
      doorAssignments: state.doorAssignments,
      notes: state.notes,
      at: state.at,
      path: state.path,
      painting: state.painting,
      drawerNotes: state.drawerNotes,
      drawerLoot: state.drawerLoot,
      turns: state.turns,
      lastMeditate: state.lastMeditate,
      sheets: state.sheets,
      cp: state.cp,
      ap: state.ap,
      grimoire: state.grimoire,
      resDist: state.resDist,
      resLock: state.resLock,
      examined: state.examined,
      clearedRooms: state.clearedRooms,
      clearedFirstTry: state.clearedFirstTry,
      visited: state.visited,
      revisited: state.revisited,
      revisitCounts: state.revisitCounts,
      loopHits: state.loopHits,
      songsPlayed: state.songsPlayed,
      painted: state.painted,
      flags: state.flags
    }));
    say("[i]Game saved.[/i]", "system");
  } catch (e) {
    say("[i]Saving is unavailable here. Saves work once the game is " +
        "hosted or opened as a normal page in a browser.[/i]", "system");
  }
}

function loadGame() {
  let data = null;
  try {
    data = localStorage.getItem(SAVE_KEY);
  } catch (e) {}
  if (!data) return say("[i]No saved game found.[/i]", "system");
  try {
    const s = JSON.parse(data);
    state.roomId = s.roomId;
    state.inventory = s.inventory || [];
    state.hands = { left: (s.hands && s.hands.left) || null,
                    right: (s.hands && s.hands.right) || null };
    state.pendingHold = null; // prompts are never restored
    state.handStash = null;
    state.taken = s.taken || [];
    state.unlocked = s.unlocked || [];
    state.doorAssignments = s.doorAssignments || {};
    state.notes = s.notes || [];
    state.at = s.at || null;
    state.path = s.path || [];
    state.painting = !!s.painting;
    state.drawerNotes = s.drawerNotes || {};
    state.drawerLoot = s.drawerLoot || {};
    state.turns = (typeof s.turns === "number") ? s.turns : 0;
    state.lastMeditate = (typeof s.lastMeditate === "number")
      ? s.lastMeditate : -99;
    state.sheets = s.sheets || [];
    state.cp = (typeof s.cp === "number") ? s.cp : 50;
    state.ap = (typeof s.ap === "number") ? s.ap : 0;
    state.grimoire = s.grimoire || [];
    state.resDist = s.resDist || 0;
    state.resLock = s.resLock || null;
    state.enemy = null;        // combat is never saved mid-fight
    state.ward = false;
    state.playerSkip = false;
    state.lastCast = null;
    state.dead = false;
    state.examined = s.examined || {};
    state.clearedRooms = s.clearedRooms || [];
    state.clearedFirstTry = s.clearedFirstTry || [];
    state.meditating = false; // prompts are never restored
    state.visited = s.visited || [];
    state.revisited = s.revisited || [];
    state.revisitCounts = s.revisitCounts || {};
    state.loopHits = s.loopHits || {};
    state.songsPlayed = s.songsPlayed || [];
    state.painted = s.painted || [];
    state.doorChoice = null; // door choices are never restored
    state.flags = s.flags || {};
    endDialogue();
    renderInventory();
    renderNotes();
    renderGrimoire();
    renderStats();
    enterRoom(state.roomId);
    say("[i]Game loaded.[/i]", "system");
  } catch (e) {
    say("[engine error] The saved game could not be loaded.", "system");
  }
}

/* ---------- begin ---------- */
renderInventory();
renderNotes();
renderGrimoire();
renderStats();
// the game itself starts when the title screen is dismissed
</script>
